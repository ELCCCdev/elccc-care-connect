.mobile-menu-button {

}

    radial-gradient(circle at 72% 7%, rgba(255,255,255,0.72) 0 11%, transparent 30%),

.cloud-panel h2,
.cloud-panel h3,

}

.hero {
  align-items: center;
  border-radius: 0 0 56px 56px;
  display: grid;
  gap: 40px;
  grid-template-columns: 1.18fr 0.82fr;
  margin-top: -78px;
  min-height: 760px;
  padding: 160px max(28px, calc((100vw - 1180px) / 2)) 80px;
}
.hero-copy, .hero-card, .compact-cloud > * { position: relative; z-index: 1; }

.cta-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }

}

}
.lime-button:hover, .ghost-button:hover, .secondary-button:hover { transform: translateY(-2px); }
.ghost-button {

  border: 1px solid rgba(255,255,255,0.36);

}
.secondary-button {

  color: white;
}
.full { width: 100%; }

.glass-card {

  background: rgba(15, 35, 47, 0.38);
  border: 1px solid rgba(255,255,255,0.3);

}

}
.mini-stack { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }

}

.section, .page-wrap, .dashboard-shell {

  max-width: 1180px;
  padding: 70px 24px;
}
.grid-3 { display: grid; gap: 22px; grid-template-columns: repeat(3, 1fr); }
.feature-card, .metric-card, .panel, .resource-card, .counselor-card, .team-card, .info-block, .prayer-card {

}
.feature-card:hover, .metric-card:hover, .resource-card:hover, .counselor-card:hover, .team-card:hover {

}
.feature-card { padding: 30px; }
.feature-card span { color: var(--lime-dark); font-size: 28px; }

.presentation-section {

  grid-template-columns: 0.9fr 1.1fr;
}
.analytics-preview {

}

}
.analytics-preview .metric-card span,
.analytics-preview .metric-card p,

}

.section-heading { margin-bottom: 26px; max-width: 760px; }
.team-strip { display: grid; gap: 18px; grid-template-columns: repeat(6, 1fr); }
.team-card {

  color: var(--slate);
  padding: 18px;
  text-align: left;
}

.avatar {

  aspect-ratio: 1;
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,0.72), transparent 36%),

  border: 5px solid rgba(255,255,255,0.8);
  border-radius: 50%;

  color: #17320d;

}
.avatar.sm {

  width: 56px;
}
.avatar.modal-avatar {

}
.team-card strong, .team-card span, .team-card small {

}
.team-card span { color: var(--blue-gray); font-weight: 700; }
.team-card small { color: rgba(16,35,45,0.68); line-height: 1.4; }

.compact-cloud {

  padding: 44px;
}
.prayer-card { display: grid; gap: 12px; padding: 22px; }
input, select, textarea {
  background: white;
  border: 1px solid rgba(111,135,149,0.28);
  border-radius: 18px;
  color: var(--slate);
  padding: 14px 16px;
  width: 100%;
}
textarea { min-height: 110px; resize: vertical; }

.page-hero { border-radius: 42px; margin-bottom: 28px; padding: 52px; }
.page-hero h1 { font-size: clamp(2.6rem, 5vw, 5rem); }
.filter-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }

.counselor-grid { display: grid; gap: 22px; grid-template-columns: repeat(3, 1fr); }
.counselor-card { overflow: hidden; padding: 22px; }
.card-body { padding-top: 12px; }
.between { align-items: center; display: flex; gap: 12px; justify-content: space-between; }
.credential-line { color: var(--blue-gray); font-weight: 800; }

.status { border-radius: 999px; font-size: 12px; font-weight: 900; padding: 6px 10px; }

.tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
.tags span {

  border-color: rgba(111,135,149,0.14);
  color: var(--slate);
  font-size: 12px;
  font-weight: 800;
}
.tags.light span { background: rgba(255,255,255,0.2); color: white; }

.modal-backdrop {
  align-items: center;
  background: rgba(10, 23, 31, 0.64);

}
.profile-modal, .dialog-modal {

  width: 100%;
}

.close-button {

  right: 18px;
  top: 18px;
  width: 44px;
  z-index: 1;
}
.profile-hero {
  align-items: center;
  background: linear-gradient(135deg, var(--slate), var(--blue-gray));
  color: white;

  gap: 28px;
  grid-template-columns: 220px 1fr;
  padding: 36px;
}
.profile-hero h2 { color: white; }
.profile-content {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(2, 1fr);
  padding: 26px;
}
.info-block { padding: 22px; }

.form-grid {
  display: grid;
  gap: 14px;
  grid-template-columns: 1fr 1fr;
}
.form-grid .full-row { grid-column: 1 / -1; }
.confirmation {

}

.login-role-grid {

  grid-template-columns: repeat(3, 1fr);

}
.role-card {

.quiz-layout { display: grid; gap: 28px; grid-template-columns: 1fr 380px; }

.recommendation-card {

  top: 112px;
}
.recommendation-card h2,
.recommendation-card p {
  color: white;
}
.score-ring {
  align-items: center;
  background: radial-gradient(circle, rgba(255,255,255,0.12) 56%, var(--lime) 58%);

  font-size: 28px;
  font-weight: 900;
  height: 132px;
  margin: 20px auto;
  place-items: center;
  width: 132px;
}

.resource-grid { display: grid; gap: 18px; grid-template-columns: repeat(4, 1fr); }
.resource-card { padding: 22px; }
.resource-card span {
  color: var(--lime-dark);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.resource-tools {

}

}

.dashboard-shell { max-width: 1320px; }
.dashboard-hero {
  align-items: center;
  background: linear-gradient(135deg, var(--slate), #718b99);
  border-radius: 42px;
  box-shadow: var(--shadow);

  display: flex;
  justify-content: space-between;
  margin-bottom: 24px;
  padding: 44px;
}

.dashboard-grid {

}
.dashboard-grid.five { grid-template-columns: repeat(5, 1fr); }
.metric-card { padding: 22px; position: relative; overflow: hidden; }
.metric-card::before {
  background: radial-gradient(circle, rgba(167,217,67,0.28), transparent 60%);
  content: "";
  height: 120px;
  position: absolute;
  right: -50px;
  top: -50px;
  width: 120px;
}
.metric-card span {

  text-transform: uppercase;
}
.metric-card strong {

  margin: 14px 0 8px;
}
.metric-card em {
  background: #eef8d8;

  font-weight: 900;
  padding: 6px 10px;
}

.chart-grid { display: grid; gap: 18px; grid-template-columns: 1.3fr 0.9fr 1fr; margin-bottom: 18px; }
.two-column { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; }
.panel { padding: 22px; }
.panel-title { align-items: center; display: flex; justify-content: space-between; margin-bottom: 16px; }
.panel-title span { color: var(--blue-gray); font-size: 12px; font-weight: 800; }

.bar-chart { align-items: end; display: flex; gap: 14px; height: 240px; }

.bar-item span, .bar-item strong { color: var(--blue-gray); font-size: 12px; }

.table-list > div {

  padding: 12px 14px;
}
.table-list em {
  background: #eef8d8;
  border-radius: 999px;
  color: #587a14;
  font-size: 12px;

  padding: 6px 10px;
}
.list p { background: #f7fafb; border-radius: 18px; margin: 0; padding: 14px; }
.list strong, .list span { display: block; }

.admin-tabs { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 18px; }

toLowerCase().includes(answers.faith.toLowerCase())) score += 5; return { counselor, score }; }).sort((a, b) => b.score - a.score)[0].counselor; } function avatar(person, extra = "") { return `<div class="avatar ${extra}" aria-label="${person.name} avatar">${initials(person.name)}</div>`; } function feature(title, text) { return `<article class="feature-card"><span>✦</span><h3>${title}</h3><p>${text}</p></article>`; } function teamCard(counselor) { return `<button class="team-card" data-counselor="${counselor.id}">${avatar(counselor)}<strong>${counselor.name}</strong><span>${counselor.credentials}</span><small>${counselor.specialties.slice(0, 2).join(" • ")}</small></button>`; } function counselorCard(counselor) { return `<article class="counselor-card">${avatar(counselor)}<div class="card-body"><div class="between"><h3>${counselor.name}</h3><span class="${counselor.acceptingNew ? "status green" : "status muted"}">${counselor.acceptingNew ? "Open" : "Waitlist"}</span></div><p class="credential-line">${counselor.credentials} · ${counselor.role}</p><p>${counselor.bio}</p><div class="tags">${counselor.specialties.slice(0, 4).map((tag) => `<span>${tag}</span>`).join("")}</div><button class="lime-button full" data-counselor="${counselor.id}">View Profile</button></div></article>`; } function quizField(label, key, options) { return `<fieldset class="quiz-field"><legend>${label}</legend>${options.map((option) => `<button type="button" data-quiz-key="${key}" data-quiz-value="${option}" class="${state.quiz[key] === option ? "active" : ""}">${option}</button>`).join("")}</fieldset>`; } function resourceCard(resource) { return `<article class="resource-card"><span>${resource.category}</span><h3>${resource.title}</h3><p>${resource.audience} · ${resource.readTime}</p></article>`; } function compactResource(resource) { return `<p class="compact-resource"><strong>${resource.title}</strong><span>${resource.category} · ${resource.readTime}</span></p>`; } function pageHero(eyebrow, title, text) { return `<div class="page-hero cloud-panel"><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p>${text}</p></div>`; } function metric(label, value, detail, trend = "") { return `<article class="metric-card"><span>${label}</span><strong>${value}</strong><p>${detail}</p>${trend ? `<em>${trend}</em>` : ""}</article>`; } function panel(title, body) { return `<section class="panel"><div class="panel-title"><h3>${title}</h3><span>Mock data</span></div>${body}</section>`; } function dashboardLayout(title, subtitle, children) { return `<section class="dashboard-shell"><div class="dashboard-hero"><div><p class="eyebrow">ELCCC Care Connect</p><h1>${title}</h1><p>${subtitle}</p></div><button class="lime-button" data-presentation-open>Export Presentation</button></div>${children}</section>`; } function barChart(data) { const max = Math.max(...data.map((item) => item.value)); return `<div class="bar-chart">${data.map((item) => `<div class="bar-item"><div style="height:${(item.value / max) * 100}%"></div><span>${item.month}</span><strong>${item.value}</strong></div>`).join("")}</div>`; } function donutChart(data) { return `<div class="donut-wrap"><div class="donut"></div><div>${data.map((item) => `<p><span class="legend-dot"></span>${item.label}: ${item.value}%</p>`).join("")}</div></div>`; } function horizontalBars(data) { const max = Math.max(...data.map((item) => item.value)); return `<div class="hbars">${data.map((item) => `<div><span>${item.label}</span><div><i style="width:${(item.value / max) * 100}%"></i></div><strong>${item.value}</strong></div>`).join("")}</div>`; } function prayerForm() { return `<form class="prayer-card"><input placeholder="Name or Anonymous" /><select><option>Prayer category</option><option>Anxiety</option><option>Family</option><option>Recovery</option></select><textarea placeholder="How can we pray for you?"></textarea><button type="button" class="lime-button full">Submit Prayer Request</button></form>`; }

  document.querySelectorAll("[data-booking-form]").forEach((form) => form.addEventListener("submit", (event) => { event.preventDefault(); if (state.bookingSubmitted) return; const fields = new FormData(form); const request = { id: `demo-${state.demoRequests.length + 1}`, demo: true, name: fields.get("name"), concern: fields.get("concern"), preferredCare: fields.get("concern"), format: fields.get("format"), preferredCounselorId: state.bookingCounselor.id, counselorId: null, appointment: null, status: "New", source: "Fictional demo", urgency: "Routine" }; state.demoRequests.unshift(request); state.activeRequestId = request.id; state.bookingSubmitted = true; state.notice = "Fictional request submitted and added to the Admin CRM."; render(); }));

  document.querySelectorAll("[data-presentation-open]").forEach((el) => el.addEventListener("click", () => { state.showPresentation = true; render(); }));
  document.querySelectorAll("[data-presentation-close]").forEach((el) => el.addEventListener("click", () => { state.showPresentation = false; render(); }));

  const resourceSearch = document.querySelector("[data-resource-search]");
  if (resourceSearch) resourceSearch.addEventListener("input", (event) => {
    const cursor = event.target.selectionStart || event.target.value.length;
    state.resourceSearch = event.target.value;
    render();
    const nextSearch = document.querySelector("[data-resource-search]");
    if (nextSearch) {
      nextSearch.focus();
      nextSearch.setSelectionRange(cursor, cursor);
    }
  });

  const resourceCategory = document.querySelector("[data-resource-category]");
  if (resourceCategory) resourceCategory.addEventListener("change", (event) => { state.resourceCategory = event.target.value; render(); });
}

 document.querySelectorAll('[data-demo-schedule]').forEach(form => form.addEventListener('submit', e => { e.preventDefault(); const r = state.demoRequests.find(r => r.id === form.dataset.demoSchedule); const data = new FormData(form); const date = data.get('date'); const time = data.get('time'); if (r?.status !== 'Assigned') return; const today = new Date().toLocaleDateString('en-CA', {timeZone:'America/New_York'}); if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || date < today) { state.notice = 'Choose today or a future appointment date.'; render(); return; } if (careRecords().some(other => other.id !== r.id && other.counselorId === r.counselorId && other.appointment?.date === date && other.appointment?.time === time)) { state.notice = 'This counselor already has a demo appointment in that slot. Choose another time.'; render(); return; } r.appointment = {date, time}; careDetails(r).cancelled = false; r.status = 'Scheduled'; state.notice = `${r.name}: demo appointment confirmed for ${date} at ${time} Eastern Time.`; render(); }));

function clientAppointmentPanel(r) {
 const care = careDetails(r); const pending = care.reschedule?.status === "Pending" || care.cancellation?.status === "Pending";
 return `<div class="workspace-stack">${demoRequestSummary(r)}${rescheduleSummary(r)}${cancellationSummary(r)}${r.appointment || r.sampleAppointment ? (pending ? "<p>Your current appointment stays confirmed until the administrator approves the requested change.</p>" : `<form class="form-grid" data-reschedule-request="${r.id}"><label>Requested date<input name="date" type="date" required min="${demoToday()}" /></label><label>Requested time (Eastern Time)<select name="time">${demoTimeOptions()}</select></label><label>Optional fictional reason<select name="reason"><option value="">No reason provided</option><option>Demo schedule conflict</option><option>Prefer a different demo time</option></select></label><button type="submit" class="lime-button">Request Demo Reschedule</button></form><form data-cancellation-request="${r.id}"><label>Optional cancellation reason<select name="reason"><option value="">No reason provided</option><option>Demo schedule conflict</option></select></label><button type="submit" class="secondary-button">Request Demo Cancellation</button></form>`) : "<p>No confirmed appointment to change. Your counselor assignment and care activities remain available.</p>"}</div>`;
}

function counselorWorkspace() {
 const r = selectedWorkspaceRecord();
 if (!r) return "<p>Select a counselor with assigned fictional clients to open a workspace.</p>";
 const assigned = careRecords().filter(item => item.counselorId === state.demoCounselorId);
 const care = careDetails(r);
 return `<div class="workspace-stack"><label>Assigned fictional client<select data-workspace-select>${assigned.map(item => `<option value="${item.id}" ${item.id === r.id ? "selected" : ""}>${escapeHtml(item.name)} · ${item.id} · ${item.demo ? "Connected request" : "Sample fixture"}</option>`).join("")}</select></label><h2>Workspace: ${escapeHtml(r.name)}</h2>${demoRequestSummary(r)}${rescheduleSummary(r)}${cancellationSummary(r)}<p class="workspace-status">${outstandingTasks(r)} outstanding tasks · Intake ${care.intake.submitted ? "submitted" : "pending"}</p><h3>Homework Assignments</h3>${homeworkPanel(r,true)}<h3>Follow-up Reminders</h3>${care.reminders.map(reminder => `<article class="care-plan"><p>${reminder.title} · ${reminder.done ? "Completed" : "Pending"}</p><button class="secondary-button" data-reminder-toggle="${reminder.id}" data-care-client="${r.id}">${reminder.done ? "Reopen Reminder" : "Complete Reminder"}</button></article>`).join("")}</div>`;
}
function adminReschedulePanel() {
 const records = careRecords().filter(r => careDetails(r).reschedule);
 return records.length ? `<div class="workspace-stack">${records.map(r => `<article class="care-plan"><h3>${escapeHtml(r.name)} · ${r.id}</h3>${rescheduleSummary(r)}<p>Current appointment: ${r.appointment ? `${r.appointment.date} at ${r.appointment.time}` : (r.sampleAppointment || "No confirmed appointment")} · Counselor: ${counselors.find(c => c.id === r.counselorId)?.name || "Unassigned"}</p>${careDetails(r).reschedule.status === "Pending" ? `<button class="lime-button" data-reschedule-approve="${r.id}">Approve Demo Reschedule</button><button class="secondary-button" data-reschedule-decline="${r.id}">Decline Demo Reschedule</button>` : ""}</article>`).join("")}</div>` : "<p>No appointment reschedule requests yet.</p>";
}
function demoToday() {return new Date().toLocaleDateString('en-CA', {timeZone:'America/New_York'});}
function demoTimeOptions() {return ["09:00","11:00","14:00","16:00"].map(time => `<option>${time}</option>`).join("");}
function validDemoSlot(date,time) {if (!Number.isFinite(new Date(`${date}T12:00:00Z`).getTime())) return false; return /^\d{4}-\d{2}-\d{2}$/.test(date || "") && new Date(`${date}T12:00:00Z`).toISOString().slice(0,10) === date && date >= demoToday() && ["09:00","11:00","14:00","16:00"].includes(time);}
function workspaceNotice(r,message) {careDetails(r).message=message; state.notice=`${r.name}: ${message}`; render();}
function bindWorkspaceEvents() {
 const bind = (selector,type,handler) => document.querySelectorAll(selector).forEach(el => el.addEventListener(type,event => {event.preventDefault();handler(el);}));
 const clientRecord = id => {const r=selectedCareRecord();return state.view === "client" && r.id === id ? r : null;};
 const counselorRecord = id => {const r=selectedWorkspaceRecord();return state.view === "counselor" && r?.id === id && r.counselorId === state.demoCounselorId ? r : null;};
 bind('[data-workspace-client]','click',el=>{const r=careRecords().find(r=>r.id===el.dataset.workspaceClient && r.counselorId===state.demoCounselorId);if(r){state.workspaceClientId=r.id;state.notice="";render();document.querySelector('[data-workspace-select]')?.focus();}});
 bind('[data-workspace-select]','change',el=>{state.workspaceClientId=el.value;state.notice="";render();});
 bind('[data-sample-intake]','submit',form=>{const r=clientRecord(form.dataset.sampleIntake);if(!r)return;const fields=new FormData(form);if(!["Morning","Afternoon","Evening"].includes(fields.get('preference')) || fields.get('orientation')!=="Reviewed")return workspaceNotice(r,'Choose the sample orientation response before submitting.');careDetails(r).intake={submitted:true,preference:fields.get('preference')};workspaceNotice(r,'Sample intake submitted; your counselor can see its completion.');});
 bind('[data-homework-assign]','submit',form=>{const r=counselorRecord(form.dataset.homeworkAssign);if(!r)return;const fields=new FormData(form);const title=fields.get('title'),due=fields.get('due'); const template=activityTemplate(title); const customTitle=String(fields.get("customTitle") || "").trim(); const instructions=String(fields.get("instructions") || "").trim(); if(customTitle.length>120 || instructions.length>800)return workspaceNotice(r,"Keep mock titles and instructions within the displayed limits.");if(!homeworkTemplates.includes(title) || (due && !validDemoSlot(due,'09:00')))return workspaceNotice(r,'Choose a valid activity and today or a future due date.');const homework=careDetails(r).homework;homework.push({id:`homework-${homework.length+1}`,title:customTitle || title,type:template.type,instructions:instructions || template.instructions,due,status:'Assigned'});workspaceNotice(r,'Demo homework assigned and visible in this client’s portal.');});
 bind('[data-homework-submit]','click',el=>{const r=clientRecord(el.dataset.careClient);const h=r && careDetails(r).homework.find(h=>h.id===el.dataset.homeworkSubmit);if(h?.status==='Assigned'){const response=el.form ? String(new FormData(el.form).get('response') || '').trim() : ''; if(response.length>1500)return workspaceNotice(r,'Keep the fictional response within 1500 characters.'); h.response=response || 'Completed the fictional sample activity.'; h.status='Submitted';workspaceNotice(r,'Sample homework submitted for counselor review.');}});
 bind('[data-homework-review]','click',el=>{const r=counselorRecord(el.dataset.careClient);const h=r && careDetails(r).homework.find(h=>h.id===el.dataset.homeworkReview);if(h?.status==='Submitted'){h.status='Reviewed';workspaceNotice(r,'Homework marked reviewed.');}});
 bind('[data-reminder-toggle]','click',el=>{const r=counselorRecord(el.dataset.careClient);const reminder=r && careDetails(r).reminders.find(item=>item.id===el.dataset.reminderToggle);if(reminder){reminder.done=!reminder.done;workspaceNotice(r,'Follow-up reminder updated.');}});
 bind('[data-reschedule-request]','submit',form=>{const r=clientRecord(form.dataset.rescheduleRequest);if(!r || !(r.appointment || r.sampleAppointment) || (careDetails(r).reschedule?.status==='Pending' || careDetails(r).cancellation?.status==='Pending'))return;const fields=new FormData(form),date=fields.get('date'),time=fields.get('time'),reason=fields.get('reason');if(!validDemoSlot(date,time) || !['', 'Demo schedule conflict','Prefer a different demo time'].includes(reason))return workspaceNotice(r,'Choose a valid future demo date and time.');if(r.appointment?.date===date && r.appointment?.time===time)return workspaceNotice(r,'Choose a different date or time from the current appointment.');careDetails(r).reschedule={date,time,reason:reason || 'No reason provided',status:'Pending'};workspaceNotice(r,'Reschedule requested. Your current appointment remains unchanged until admin approval.');});
 bind('[data-reschedule-approve]','click',el=>{if(state.view!=='admin')return;const r=careRecords().find(r=>r.id===el.dataset.rescheduleApprove);const request=r && careDetails(r).reschedule;if(request?.status!=='Pending')return;if(!validDemoSlot(request.date,request.time))return workspaceNotice(r,'Requested slot is no longer valid. Decline it and request a future slot.');if(careRecords().some(other=>other.id!==r.id && other.counselorId===r.counselorId && other.appointment?.date===request.date && other.appointment?.time===request.time))return workspaceNotice(r,'This counselor already has an appointment in the requested slot.');r.appointment={date:request.date,time:request.time};careDetails(r).cancelled=false;request.status='Approved';workspaceNotice(r,'Reschedule approved; updated appointment is visible to client and counselor.');});
 bind('[data-reschedule-decline]','click',el=>{if(state.view!=='admin')return;const r=careRecords().find(r=>r.id===el.dataset.rescheduleDecline);if(r && careDetails(r).reschedule?.status==='Pending'){careDetails(r).reschedule.status='Declined';workspaceNotice(r,'Reschedule declined; the current appointment is unchanged.');}});
}

function activityTemplate(title) {
 const templates = {
  "Sample reflection exercise": {type:"Reflection questions", instructions:"In a fictional scenario, name one helpful routine and describe a small next step."},
  "Practice a sample breathing routine": {type:"Exercise", instructions:"For this mock activity, read the demo routine and describe how a fictional character might practice it."},
  "Read the demo wellness worksheet": {type:"Reading", instructions:"Read the demo wellness resource and write a fictional one-sentence takeaway."},
  "Complete the sample worksheet": {type:"Worksheet", instructions:"Create a fictional example with a goal, one action, and a reflection. No real personal details."}
 };
 return templates[title] || templates["Sample reflection exercise"];
}
function cancellationSummary(r) {
 const request = careDetails(r).cancellation;
 return request ? `<p class="workspace-status">Cancellation request: ${request.status} · ${escapeHtml(request.reason)}</p>` : "";
}
function adminCancellationPanel() {
 const records=careRecords().filter(r=>careDetails(r).cancellation);
 return records.length ? `<div class="workspace-stack">${records.map(r=>`<article class="care-plan">${demoRequestSummary(r)}${cancellationSummary(r)}${careDetails(r).cancellation.status==='Pending' ? `<button class="lime-button" data-cancellation-approve="${r.id}">Approve Demo Cancellation</button><button class="secondary-button" data-cancellation-decline="${r.id}">Decline Demo Cancellation</button>` : ''}</article>`).join('')}</div>` : '<p>No cancellation requests yet.</p>';
}
function bindCancellationEvents() {
 document.querySelectorAll('[data-cancellation-request]').forEach(form=>form.addEventListener('submit',event=>{
  event.preventDefault(); const r=selectedCareRecord();const care=careDetails(r);
  if(state.view!=='client' || r.id!==form.dataset.cancellationRequest || !(r.appointment || r.sampleAppointment) || care.reschedule?.status==='Pending' || care.cancellation?.status==='Pending')return;
  const reason=new FormData(form).get('reason');if(!['','Demo schedule conflict'].includes(reason))return;
  care.cancellation={reason:reason || 'No reason provided',status:'Pending'};workspaceNotice(r,'Cancellation requested; the appointment stays confirmed until admin approval.');
 }));
 for(const outcome of ['approve','decline']) document.querySelectorAll(`[data-cancellation-${outcome}]`).forEach(el=>el.addEventListener('click',()=>{
  if(state.view!=='admin')return;const id=el.getAttribute ? el.getAttribute(`data-cancellation-${outcome}`) : el.dataset[outcome==='approve'?'cancellationApprove':'cancellationDecline'];const r=careRecords().find(r=>r.id===id);const care=r && careDetails(r);
  if(care?.cancellation?.status!=='Pending')return;
  care.cancellation.status=outcome==='approve'?'Approved':'Declined';
  if(outcome==='approve'){care.cancelled=true;r.appointment=null;r.sampleAppointment=null;if(r.demo)r.status='Assigned';}
  workspaceNotice(r,outcome==='approve'?'Cancellation approved. There is no confirmed appointment; care activities remain available.':'Cancellation declined. The original appointment is unchanged.');
 }));
}

let dialogReturnFocus = null;
function setupDialogAccessibility(focusAttribute, focusValue, hadDialog) {
 const modal = document.querySelector('.modal-backdrop');
 document.querySelectorAll('.site-header, main, .site-footer').forEach(el => { el.inert = Boolean(modal); });
 if (document.body) document.body.style.overflow = modal ? 'hidden' : '';
 if (modal) {
  if (!hadDialog) dialogReturnFocus = {attribute: focusAttribute, value: focusValue};
  const title = modal.querySelector('h2');
  if (title) { title.id = 'dialog-title'; modal.setAttribute('aria-labelledby', title.id); }
  const controls = [...modal.querySelectorAll('button, input, select, textarea, a[href]')];
  const retained = controls.find(el => focusAttribute && el.getAttribute(focusAttribute) === focusValue);
  (retained || controls[0])?.focus();
 } else {
  const target = hadDialog ? dialogReturnFocus : {attribute: focusAttribute, value: focusValue};
  const retained = target?.attribute ? [...document.querySelectorAll('[' + target.attribute + ']')].find(el => el.getAttribute(target.attribute) === target.value) : null;
  if (!hadDialog && ['data-view', 'data-workflow-go', 'data-login-continue'].includes(focusAttribute)) document.querySelector('main')?.focus();
  else retained?.focus();
 }
}
if (document.addEventListener) document.addEventListener('keydown', event => {
 const modal = document.querySelector('.modal-backdrop');
 if (!modal) {
  if (event.key === 'Escape' && state.menuOpen) { state.menuOpen = false; render(); document.querySelector('[data-menu-toggle]')?.focus(); }
  return;
 }
 if (event.key === 'Escape') {
  event.preventDefault(); state.selectedCounselor = null; state.selectedClient = null; state.bookingCounselor = null; state.showLogin = false; state.showPresentation = false; render(); return;
 }
 if (event.key === 'Tab') {
  const controls = [...modal.querySelectorAll('button, input, select, textarea, a[href]')].filter(el => !el.disabled && el.getClientRects().length);
  const first = controls[0], last = controls[controls.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
 }
});

render();
</script> </body> </html>
