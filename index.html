 :root { --cloud: #f7fbfc; --white: #ffffff; --mist: #e7f0f4; --mist-2: #d7e6ec; --blue-gray: #6f8795; --slate: #294557; --deep: #172b36; --ink: #10232d; --lime: #a7d943; --lime-2: #d9fb79; --lime-dark: #5f7f17; --sand: #f6dfa7; --rose: #f8d7da; --card: rgba(255, 255, 255, 0.94); --shadow: 0 18px 48px rgba(23, 43, 54, 0.12); --shadow-soft: 0 10px 30px rgba(23, 43, 54, 0.08); --radius-xl: 34px; --radius-lg: 24px; --radius-md: 18px; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;

  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at top left, rgba(167, 217, 67, 0.12), transparent 26rem),
    linear-gradient(180deg, #eef7fb 0%, #f8fbfc 38%, #e8f1f5 100%);
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }
h1, h2, h3, h4, p { margin-top: 0; }
p { color: rgba(16, 35, 45, 0.76); line-height: 1.7; }
h1, h2, h3, h4 { color: var(--deep); }
h1 { font-size: clamp(3rem, 7vw, 6.4rem); letter-spacing: -0.075em; line-height: 0.9; margin-bottom: 24px; }
h2 { font-size: clamp(2rem, 4vw, 4rem); letter-spacing: -0.055em; line-height: 1.02; margin-bottom: 16px; }
h3 { letter-spacing: -0.03em; }

.app-shell { min-height: 100vh; overflow-x: hidden; }

.demo-banner {
  background: linear-gradient(90deg, var(--deep), var(--slate));
  color: white;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.01em;
  padding: 10px 18px;
  text-align: center;
}

.site-header {
  align-items: center;
  backdrop-filter: blur(22px);
  background: rgba(248, 251, 252, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.82);

  display: flex;
  gap: 24px;
  justify-content: space-between;
  left: 50%;
  max-width: 1180px;
  padding: 14px 18px;
  position: sticky;
  top: 16px;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  z-index: 10;
}

.brand {
  align-items: center;
  background: transparent;
  border: 0;
  color: var(--slate);
  display: flex;
  gap: 10px;
  min-width: max-content;
}
.brand-mark {
  align-items: center;

}
.brand strong, .brand small { display: block; line-height: 1.05; text-align: left; }
.brand small { color: var(--blue-gray); font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }

.mobile-menu-button {
  display: none;

  border-radius: 14px;
  color: white;
  font-weight: 900;

  padding: 11px 13px;
}
.hamburger {
  display: inline-grid;
  gap: 4px;
  width: 18px;
}
.hamburger span {
  background: white;
  border-radius: 99px;
  display: block;
  height: 2px;
}

.nav-pills {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}
.nav-pills button, .filter-row button, .quiz-field button, .admin-tabs button, .role-button {

}
.nav-pills button.active,
.nav-pills button:hover,
.filter-row button.active,
.quiz-field button.active,
.admin-tabs button.active,

  transform: translateY(-1px);
}

.cloud-panel {
  background:
    linear-gradient(135deg, rgba(12, 31, 42, 0.52), rgba(12, 31, 42, 0.7)),
    radial-gradient(circle at 14% 18%, rgba(255,255,255,0.95) 0 10%, transparent 24%),
    radial-gradient(circle at 72% 7%, rgba(255,255,255,0.72) 0 11%, transparent 30%),
    radial-gradient(circle at 88% 64%, rgba(167,217,67,0.24) 0 12%, transparent 28%),

  overflow: hidden;
  position: relative;
}
.cloud-panel::after {
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
  content: "";
  height: 100%;
  left: -30%;
  position: absolute;
  top: 0;
  transform: skewX(-18deg);
  width: 28%;
}
.cloud-panel h1,
.cloud-panel h2,
.cloud-panel h3,
.cloud-panel p {
  color: white;
  text-shadow: 0 2px 18px rgba(0,0,0,0.28);
}

.hero {
  align-items: center;
  border-radius: 0 0 56px 56px;
  display: grid;
  gap: 40px;
  grid-template-columns: 1.18fr 0.82fr;
  margin-top: -78px;
  min-height: 760px;
  padding: 160px max(28px, calc((100vw - 1180px) / 2)) 80px;
}
.hero-copy, .hero-card, .compact-cloud > * { position: relative; z-index: 1; }
.hero-copy > p:last-of-type { font-size: 20px; max-width: 720px; }

.eyebrow {
  color: rgba(255,255,255,0.9);

  font-weight: 900;
  letter-spacing: 0.16em;
  margin: 0 0 14px;

}

}

.cta-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
.lime-button, .ghost-button, .secondary-button {

}
.lime-button {

  box-shadow: 0 18px 34px rgba(167, 217, 67, 0.34);
  color: #17320d;
}
.lime-button:hover, .ghost-button:hover, .secondary-button:hover { transform: translateY(-2px); }
.ghost-button {
  background: rgba(255,255,255,0.16);
  border: 1px solid rgba(255,255,255,0.36);
  color: white;
}
.secondary-button {
  background: var(--slate);
  color: white;
}
.full { width: 100%; }

.glass-card {
  backdrop-filter: blur(22px);
  background: rgba(15, 35, 47, 0.38);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 34px;

}
.hero-card h3 { color: white; font-size: 44px; line-height: 1; margin: 22px 0 12px; }
.live-dot {
  background: var(--lime);
  border-radius: 50%;

  margin-right: 8px;
  width: 10px;
}
.mini-stack { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.mini-stack span, .tags span {
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.24);
  border-radius: 999px;
  color: white;
  padding: 8px 11px;
}

.section, .page-wrap, .dashboard-shell {
  margin: 0 auto;
  max-width: 1180px;
  padding: 70px 24px;
}
.grid-3 { display: grid; gap: 22px; grid-template-columns: repeat(3, 1fr); }
.feature-card, .metric-card, .panel, .resource-card, .counselor-card, .team-card, .info-block, .prayer-card {
  background: var(--card);
  border: 1px solid rgba(255, 255, 255, 0.86);
  border-radius: 30px;
  box-shadow: var(--shadow-soft);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.feature-card:hover, .metric-card:hover, .resource-card:hover, .counselor-card:hover, .team-card:hover {
  box-shadow: var(--shadow);
  transform: translateY(-3px);
}
.feature-card { padding: 30px; }
.feature-card span { color: var(--lime-dark); font-size: 28px; }

.presentation-section {
  align-items: center;
  display: grid;
  gap: 34px;
  grid-template-columns: 0.9fr 1.1fr;
}
.analytics-preview {
  background: linear-gradient(135deg, rgba(41,69,87,0.98), rgba(111,135,149,0.92));
  border-radius: 38px;
  box-shadow: var(--shadow);
  display: grid;
  gap: 16px;
  grid-template-columns: 1fr 1fr;
  padding: 24px;
}
.analytics-preview .bar-chart { grid-column: 1 / -1; height: 190px; }
.analytics-preview .metric-card {
  background: rgba(255,255,255,0.14);
  border-color: rgba(255,255,255,0.24);
}
.analytics-preview .metric-card span,
.analytics-preview .metric-card p,
.analytics-preview .metric-card strong {
  color: white;
}

.section-heading { margin-bottom: 26px; max-width: 760px; }
.team-strip { display: grid; gap: 18px; grid-template-columns: repeat(6, 1fr); }
.team-card {
  border: 0;
  color: var(--slate);
  padding: 18px;
  text-align: left;
}

.avatar {
  align-items: center;
  aspect-ratio: 1;
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,0.72), transparent 36%),
    linear-gradient(135deg, var(--slate), var(--blue-gray));
  border: 5px solid rgba(255,255,255,0.8);
  border-radius: 50%;
  box-shadow: 0 18px 36px rgba(41, 69, 87, 0.18);
  color: white;
  display: grid;
  font-size: clamp(1.6rem, 4vw, 2.6rem);
  font-weight: 950;
  letter-spacing: -0.08em;
  margin-bottom: 14px;
  place-items: center;
  position: relative;
  text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  width: 100%;
}
.avatar::after {
  content: "✦";
  align-items: center;
  background: linear-gradient(135deg, var(--lime), var(--lime-2));
  border-radius: 50%;
  bottom: 6%;
  box-shadow: 0 6px 18px rgba(167, 217, 67, 0.32);
  color: #17320d;
  display: grid;
  font-size: 0.42em;
  height: 28%;
  place-items: center;
  position: absolute;
  right: 4%;
  width: 28%;
}
.avatar.sm {
  font-size: 1.05rem;
  height: 56px;
  margin: 0;
  min-width: 56px;
  width: 56px;
}
.avatar.modal-avatar {
  font-size: 3.6rem;
  height: 220px;
  margin: 0;
  width: 220px;
}
.team-card strong, .team-card span, .team-card small {
  display: block;
  margin-top: 8px;
}
.team-card span { color: var(--blue-gray); font-weight: 700; }
.team-card small { color: rgba(16,35,45,0.68); line-height: 1.4; }

.compact-cloud {
  align-items: center;
  border-radius: 44px;
  display: grid;
  gap: 30px;
  grid-template-columns: 1fr 420px;
  padding: 44px;
}
.prayer-card { display: grid; gap: 12px; padding: 22px; }
input, select, textarea {
  background: white;
  border: 1px solid rgba(111,135,149,0.28);
  border-radius: 18px;
  color: var(--slate);
  padding: 14px 16px;
  width: 100%;
}
textarea { min-height: 110px; resize: vertical; }

.page-hero { border-radius: 42px; margin-bottom: 28px; padding: 52px; }
.page-hero h1 { font-size: clamp(2.6rem, 5vw, 5rem); }
.filter-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }

.counselor-grid { display: grid; gap: 22px; grid-template-columns: repeat(3, 1fr); }
.counselor-card { overflow: hidden; padding: 22px; }
.card-body { padding-top: 12px; }
.between { align-items: center; display: flex; gap: 12px; justify-content: space-between; }
.credential-line { color: var(--blue-gray); font-weight: 800; }
.credential-line.white { color: rgba(255,255,255,0.86); }
.status { border-radius: 999px; font-size: 12px; font-weight: 900; padding: 6px 10px; }
.status.green { background: #eef8d8; color: #557414; }
.status.muted { background: #edf1f3; color: var(--blue-gray); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
.tags span {
  background: #eef5f7;
  border-color: rgba(111,135,149,0.14);
  color: var(--slate);
  font-size: 12px;
  font-weight: 800;
}
.tags.light span { background: rgba(255,255,255,0.2); color: white; }

.modal-backdrop {
  align-items: center;
  background: rgba(10, 23, 31, 0.64);
  display: flex;
  inset: 0;
  justify-content: center;
  padding: 24px;
  position: fixed;
  z-index: 30;
}
.profile-modal, .dialog-modal {
  background: var(--cloud);
  border-radius: 36px;
  box-shadow: 0 30px 90px rgba(0,0,0,0.28);
  max-height: 92vh;
  max-width: 940px;
  overflow: auto;
  position: relative;
  width: 100%;
}
.dialog-modal { max-width: 760px; padding: 30px; }
.close-button {
  background: rgba(255,255,255,0.92);
  border: 0;
  border-radius: 50%;
  color: var(--deep);
  font-size: 28px;
  height: 44px;
  position: absolute;
  right: 18px;
  top: 18px;
  width: 44px;
  z-index: 1;
}
.profile-hero {
  align-items: center;
  background: linear-gradient(135deg, var(--slate), var(--blue-gray));
  color: white;
  display: grid;
  gap: 28px;
  grid-template-columns: 220px 1fr;
  padding: 36px;
}
.profile-hero h2 { color: white; }
.profile-content {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(2, 1fr);
  padding: 26px;
}
.info-block { padding: 22px; }

.form-grid {
  display: grid;
  gap: 14px;
  grid-template-columns: 1fr 1fr;
}
.form-grid .full-row { grid-column: 1 / -1; }
.confirmation {
  background: #eef8d8;
  border: 1px solid rgba(95, 127, 23, 0.22);
  border-radius: 18px;
  color: #38520b;
  display: none;
  font-weight: 800;
  margin-top: 16px;
  padding: 14px;
}
.confirmation.show { display: block; }

.login-role-grid {
  display: grid;
  gap: 14px;
  grid-template-columns: repeat(3, 1fr);
  margin: 22px 0;
}
.role-card {
  background: white;
  border: 1px solid rgba(111,135,149,0.22);
  border-radius: 22px;
  padding: 18px;
  text-align: center;
  transition: 0.2s ease;
}
.role-card:hover {
  border-color: var(--lime-dark);
  box-shadow: var(--shadow-soft);
  transform: translateY(-2px);
}

.quiz-layout { display: grid; gap: 28px; grid-template-columns: 1fr 380px; }
.quiz-field { border: 0; display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 22px; padding: 0; }
.quiz-field legend { color: var(--slate); font-size: 18px; font-weight: 900; margin-bottom: 12px; }
.recommendation-card {
  align-self: start;
  background: linear-gradient(150deg, rgba(41,69,87,0.98), rgba(111,135,149,0.92));
  color: white;
  position: sticky;
  top: 112px;
}
.recommendation-card h2,
.recommendation-card p {
  color: white;
}
.score-ring {
  align-items: center;
  background: radial-gradient(circle, rgba(255,255,255,0.12) 56%, var(--lime) 58%);
  border-radius: 50%;
  display: grid;
  font-size: 28px;
  font-weight: 900;
  height: 132px;
  margin: 20px auto;
  place-items: center;
  width: 132px;
}

.resource-grid { display: grid; gap: 18px; grid-template-columns: repeat(4, 1fr); }
.resource-card { padding: 22px; }
.resource-card span {
  color: var(--lime-dark);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.resource-tools {
  align-items: center;
  display: grid;
  gap: 12px;
  grid-template-columns: 1fr 240px auto;
  margin-bottom: 22px;
}
.resource-tools strong {
  background: var(--slate);
  border-radius: 999px;
  color: white;
  padding: 12px 16px;
  text-align: center;
}

.dashboard-shell { max-width: 1320px; }
.dashboard-hero {
  align-items: center;
  background: linear-gradient(135deg, var(--slate), #718b99);
  border-radius: 42px;
  box-shadow: var(--shadow);
  color: white;
  display: flex;
  justify-content: space-between;
  margin-bottom: 24px;
  padding: 44px;
}
.dashboard-hero h1, .dashboard-hero p { color: white; }
.dashboard-hero h1 { font-size: clamp(2.4rem, 5vw, 4.8rem); }

.dashboard-grid {
  display: grid;
  gap: 18px;
  grid-template-columns: repeat(4, 1fr);
  margin-bottom: 18px;
}
.dashboard-grid.five { grid-template-columns: repeat(5, 1fr); }
.metric-card { padding: 22px; position: relative; overflow: hidden; }
.metric-card::before {
  background: radial-gradient(circle, rgba(167,217,67,0.28), transparent 60%);
  content: "";
  height: 120px;
  position: absolute;
  right: -50px;
  top: -50px;
  width: 120px;
}
.metric-card span {
  color: var(--blue-gray);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.metric-card strong {
  color: var(--slate);
  display: block;
  font-size: 42px;
  letter-spacing: -0.06em;
  line-height: 1;
  margin: 14px 0 8px;
}
.metric-card em {
  background: #eef8d8;
  border-radius: 999px;
  color: #587a14;
  display: inline-block;
  font-size: 12px;
  font-style: normal;
  font-weight: 900;
  padding: 6px 10px;
}

.chart-grid { display: grid; gap: 18px; grid-template-columns: 1.3fr 0.9fr 1fr; margin-bottom: 18px; }
.two-column { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; }
.panel { padding: 22px; }
.panel-title { align-items: center; display: flex; justify-content: space-between; margin-bottom: 16px; }
.panel-title span { color: var(--blue-gray); font-size: 12px; font-weight: 800; }

.bar-chart { align-items: end; display: flex; gap: 14px; height: 240px; }
.bar-item { align-items: center; display: flex; flex: 1; flex-direction: column; gap: 8px; height: 100%; justify-content: end; }
.bar-item div { background: linear-gradient(180deg, var(--lime), #6f8795); border-radius: 999px 999px 8px 8px; min-height: 18px; width: 100%; }
.bar-item span, .bar-item strong { color: var(--blue-gray); font-size: 12px; }
.donut-wrap { align-items: center; display: grid; gap: 20px; grid-template-columns: 150px 1fr; }
.donut {
  aspect-ratio: 1;
  background: conic-gradient(var(--lime) 0 38%, #7aa6b5 38% 62%, #294557 62% 80%, #dceaf0 80% 100%);
  border-radius: 50%;
  position: relative;
}
.donut::after {
  background: var(--cloud);
  border-radius: 50%;
  content: "";
  inset: 30px;
  position: absolute;
}
.legend-dot { background: var(--lime); border-radius: 50%; display: inline-block; height: 10px; margin-right: 8px; width: 10px; }

.hbars, .util-list, .table-list, .list { display: grid; gap: 12px; }
.hbars > div, .util-list > div { align-items: center; display: grid; gap: 10px; grid-template-columns: 100px 1fr 42px; }
.hbars div div, .util-list div div { background: #e9f1f5; border-radius: 999px; height: 12px; overflow: hidden; }
.hbars i, .util-list i { background: linear-gradient(90deg, var(--lime), #7192a1); border-radius: inherit; display: block; height: 100%; }
.table-list > div {
  align-items: center;
  background: #f7fafb;
  border-radius: 18px;
  display: grid;
  gap: 10px;
  grid-template-columns: 1.2fr 1fr auto;

e>`).join('')}</div>`;} function clientDirectory(){const records=careRecords();const selected=records.find(r=>r.id===state.profileClientId)||records[0];return `<p>Review the selected client's counselor, appointments, and care activity.</p><label>Client profile<select data-admin-profile>${records.map(r=>`<option value="${r.id}" ${r.id===selected.id?'selected':''}>${escapeHtml(r.name)} · ${r.demo?'Session referral':'Historical sample'}</option>`).join('')}</select></label><div class="resource-grid">${[selected].map(r=>`<article class="care-plan"><h3>${escapeHtml(r.name)}</h3><p>${r.demo?'Session referral':'Archived test record'} · ${friendlyRecordLabel(r)}</p>${demoRequestSummary(r)}<button class="secondary-button" data-profile-details="${r.id}">View Profile Details</button><button class="secondary-button" data-admin-followup="${r.id}">${r.adminFollowed?'Follow-up Completed':'Complete Administrative Follow-up'}</button>${state.profileDetails===r.id?`<div>${info('Intake',careDetails(r).intake.submitted?'Submitted':'Pending')}${info('Homework',careDetails(r).homework.length+' assigned')}${r.counselorId?`<button class="lime-button" data-open-care="${r.id}">Open Counselor Workspace</button>`:'<p>Assign a counselor in Appointment Requests first.</p>'}</div>`:''}</article>`).join('')}</div>`;} function clientProfileModal(client) { const careRecord=careRecords().find(r=>r.id===`sample-${client.id}`); const nextAppointment=careRecord.appointment ? `${careRecord.appointment.date} at ${careRecord.appointment.time}` : careRecord.sampleAppointment || "Cancelled. No confirmed appointment"; const counselor = counselors.find((item) => item.id === client.counselorId) || counselors[0]; return `<div class="modal-backdrop" role="dialog" aria-modal="true"><article class="profile-modal client-modal"><button class="close-button" aria-label="Close dialog" data-close-client>×</button><div class="profile-hero"><div class="client-avatar">${initials(client.name)}</div><div><p class="eyebrow">Client Profile</p><h2>${client.name}</h2><p class="credential-line white">${client.ageGroup} · ${client.status} · Assigned to ${counselor.name}</p><div class="tags light"><span>${client.concern}</span><span>Next: ${nextAppointment}</span></div></div></div><div class="profile-content">${info("Care status", client.status)}${info("Primary concern", client.concern)}${info("Assigned counselor", `${counselor.name}, ${counselor.credentials}`)}${info("Last contact", client.lastContact)}${info("Next appointment", nextAppointment)}${info("Demo intake", careDetails(careRecord).intake.submitted ? "Submitted" : "Pending")}${info("Homework activities", `${careDetails(careRecord).homework.length} assigned`)}<button class="lime-button" data-open-care="${careRecord.id}">Open Client Workspace</button>${info("Mock notes", "Forms, appointments, follow-up tasks, billing placeholders, and message summaries are prototype-only mock data.")}</div></article></div>`; } function counselorProfileModal(counselor) { return `<div class="modal-backdrop" role="dialog" aria-modal="true"><article class="profile-modal"><button class="close-button" aria-label="Close dialog" data-close-counselor>×</button><div class="profile-hero">${avatar(counselor, "modal-avatar")}<div><p class="eyebrow">Counselor Profile</p><h2>${counselor.name}</h2><p class="credential-line white">${counselor.credentials} · ${counselor.role}</p><div class="tags light">${counselor.populations.map((tag) => `<span>${tag}</span>`).join("")}</div></div></div><div class="profile-content">${info("Bio", counselor.bio)}${info("Specialties", counselor.specialties.join(", "))}${info("Insurance accepted", counselor.insurance.join(", "))}${info("Faith integration approach", counselor.faithApproach)}${info("Availability", `${counselor.availability} · ${counselor.location}`)}${info("Utilization", `${counselor.utilization}% mock caseload utilization`)}<div class="info-block"><button class="lime-button full" data-book="${counselor.id}">Request Appointment</button></div></div></article></div>`; } function loginModal() {return `<div class="modal-backdrop" role="dialog" aria-modal="true"><article class="dialog-modal"><button class="close-button" aria-label="Close dialog" data-login-close>×</button><p class="eyebrow dark">Workspace selection</p><h2>Switch Role</h2><p>Choose a workspace. Role selection does not sign you in or provide secure access.</p><div class="login-role-grid">${['Client','Counselor','Admin'].map(role=>`<button class="role-card ${state.selectedRole===role?'active':''}" data-role="${role}" aria-pressed="${state.selectedRole===role}"><strong>${role==='Admin'?'Administrator':role}</strong><span>Open this workspace</span></button>`).join('')}</div><button class="lime-button full" data-login-continue>Continue to ${state.selectedRole==='Admin'?'Administrator':state.selectedRole}</button><button class="secondary-button full" data-visitor>Explore Counseling Services</button></article></div>`;}

ecommendCounselor(answers) { return counselors.map((counselor) => { let score = counselor.acceptingNew ? 20 : 0; if (counselor.specialties.includes(answers.concern)) score += 40; if (counselor.populations.includes(answers.person) || (answers.person === "Couple" && counselor.populations.includes("Couples"))) score += 20; if (answers.location === "Any" || counselor.location === answers.location) score += 15; if (counselor.faithApproach.toLowerCase().includes(answers.faith.toLowerCase())) score += 5; return { counselor, score }; }).sort((a, b) => b.score - a.score)[0].counselor; } function avatar(person, extra = "") { return `<div class="avatar ${extra}" aria-label="${person.name} avatar">${initials(person.name)}</div>`; } function feature(title, text) { return `<article class="feature-card"><span>✦</span><h3>${title}</h3><p>${text}</p></article>`; } function teamCard(counselor) { return `<button class="team-card" data-counselor="${counselor.id}">${avatar(counselor)}<strong>${counselor.name}</strong><span>${counselor.credentials}</span><small>${counselor.specialties.slice(0, 2).join(" • ")}</small></button>`; } function counselorCard(counselor) { return `<article class="counselor-card">${avatar(counselor)}<div class="card-body"><div class="between"><h3>${counselor.name}</h3><span class="${counselor.acceptingNew ? "status green" : "status muted"}">${counselor.acceptingNew ? "Open" : "Waitlist"}</span></div><p class="credential-line">${counselor.credentials} · ${counselor.role}</p><p>${counselor.bio}</p><div class="tags">${counselor.specialties.slice(0, 4).map((tag) => `<span>${tag}</span>`).join("")}</div><button class="lime-button full" data-counselor="${counselor.id}">View Profile</button></div></article>`; } function quizField(label, key, options) { return `<fieldset class="quiz-field"><legend>${label}</legend>${options.map((option) => `<button type="button" data-quiz-key="${key}" data-quiz-value="${option}" class="${state.quiz[key] === option ? "active" : ""}">${option}</button>`).join("")}</fieldset>`; } function resourceCard(resource) { return `<article class="resource-card"><span>${resource.category}</span><h3>${resource.title}</h3><p>${resource.audience} · ${resource.readTime}</p></article>`; } function compactResource(resource) { return `<p class="compact-resource"><strong>${resource.title}</strong><span>${resource.category} · ${resource.readTime}</span></p>`; } function pageHero(eyebrow, title, text) { return `<div class="page-hero cloud-panel"><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p>${text}</p></div>`; } function metric(label, value, detail, trend = "") { return `<article class="metric-card"><span>${label}</span><strong>${value}</strong><p>${detail}</p>${trend ? `<em>${trend}</em>` : ""}</article>`; } function panel(title, body) { return `<section class="panel" id="area-${title.toLowerCase().replace(/[^a-z0-9]+/g,'-')}"><div class="panel-title"><h3>${title}</h3></div>${body}</section>`; } function dashboardLayout(title, subtitle, children) { return `<section class="dashboard-shell"><div class="dashboard-hero"><div><p class="eyebrow">ELCCC Care Connect</p><h1>${title}</h1><p>${subtitle}</p></div><button class="lime-button" data-presentation-open>Export Presentation</button></div>${children}</section>`; } function barChart(data) { const max = Math.max(...data.map((item) => item.value)); return `<div class="bar-chart">${data.map((item) => `<div class="bar-item"><div style="height:${(item.value / max) * 100}%"></div><span>${item.month}</span><strong>${item.value}</strong></div>`).join("")}</div>`; } function donutChart(data) { return `<div class="donut-wrap"><div class="donut"></div><div>${data.map((item) => `<p><span class="legend-dot"></span>${item.label}: ${item.value}%</p>`).join("")}</div></div>`; } function horizontalBars(data) { const max = Math.max(...data.map((item) => item.value)); return `<div class="hbars">${data.map((item) => `<div><span>${item.label}</span><div><i style="width:${(item.value / max) * 100}%"></i></div><strong>${item.value}</strong></div>`).join("")}</div>`; } function prayerForm(){return `<form class="prayer-card" data-prayer-submit><label>Requester<select name="name"><option>Anonymous Demo</option><option>Jordan Demo</option><option>Morgan Sample</option></select></label><label>Prayer category<select name="category"><option>Family</option><option>Recovery</option><option>Encouragement</option></select></label><label>Follow-up<select name="followup"><option value="yes">Request fictional follow-up</option><option value="no">Prayer only</option></select></label><button type="submit" class="lime-button full">Submit Prayer Request</button>${state.prayerNotice?`<p role="status">${escapeHtml(state.prayerNotice)}</p>`:''}</form>`;} function appointmentList() { return `<div class="list">${clients.slice(0, 4).map((client) => `<p><strong>${client.nextAppointment}</strong><span>${client.concern} session · Confirmed</span></p>`).join("")}</div>`; }

  document.querySelectorAll("[data-close-client]").forEach((el) => el.addEventListener("click", () => { state.selectedClient = null; render(); }));

  document.querySelectorAll("[data-login-open]").forEach((el) => el.addEventListener("click", () => { state.showLogin = true; state.menuOpen = false; render(); }));
  document.querySelectorAll("[data-login-close]").forEach((el) => el.addEventListener("click", () => { state.showLogin = false; render(); }));

  document.querySelectorAll("[data-book]").forEach((el) => el.addEventListener("click", () => {
    state.bookingCounselor = counselors.find((counselor) => counselor.id === el.dataset.book);

}

function minutes(time) {return Number(time.slice(0,2))*60+Number(time.slice(3));}
function schedulingError(r,date,time) {
 if(!validDemoSlot(date,time))return 'Choose a valid future demo date and time.';
 if(!r.counselorId)return 'Assign a counselor before scheduling.';
 const availability=state.availability[r.counselorId] || {start:540,end:1020,blocked:false};const start=minutes(time);
 if(start<availability.start || start+60>availability.end || (availability.blocked && start<720 && start+60>660))return 'This slot falls outside simulated counselor availability.';
 if(careRecords().some(other=>other.id!==r.id && other.counselorId===r.counselorId && other.appointment?.date===date && start<minutes(other.appointment.time)+60 && start+60>minutes(other.appointment.time)))return 'This counselor already has an appointment overlapping that slot.';
 return '';
}

 const care=ensureOperations(r); const request={...fields,type,requested:type==='reschedule'?{date:fields.date,time:fields.time}:null,approver:requestApprover(r),status:'Pending',original:copyAppointment(r),counselorId:r.counselorId,events:[{action:'Requested',at:new Date().toISOString()}]};

}

 const request=ensureOperations(r)[type];if(request?.status!=='Pending' || !mayDecide(r,request))return workspaceNotice(r,'Only the assigned approver can finalize this pending request.');
 if(outcome==='Approved' && type==='reschedule'){const error=schedulingError(r,request.date,request.time);if(error)return workspaceNotice(r,error);}
 if(outcome==='Approved'){recordAppointment(r,`Before ${type} approval`);if(type==='reschedule'){r.appointment={date:request.date,time:request.time};ensureOperations(r).cancelled=false;}else{r.appointment=null;r.sampleAppointment=null;ensureOperations(r).cancelled=true;if(r.demo)r.status='Assigned';}recordAppointment(r,`After ${type} approval`);}
 request.status=outcome;request.events.push({action:outcome,by:approverLabel(r,request),at:new Date().toISOString()});appendNotification(r,`${type} ${outcome.toLowerCase()}. ${outcome==='Declined'?'Original appointment retained.':'Confirmed appointment updated.'}`);workspaceNotice(r,`${type==='reschedule'?'Reschedule':'Cancellation'} ${outcome.toLowerCase()}; all role views updated.`);

// Only the explicitly supported local development frontend may call this backend.
function localInquiryBackend() {
 return ['http://127.0.0.1:5500', 'http://localhost:5500'].includes(window.location?.origin);
}
function inquiryPayload(fields) {
 const categories = {Anxiety:'individual', Grief:'individual', Marriage:'couples', Children:'family'};
 if (!['Jordan Demo','Taylor Example','Morgan Sample'].includes(fields.get('name')) || !categories[fields.get('concern')]) throw new Error('Choose one of the preset fictional scenarios.');
 if (!['email','phone'].includes(fields.get('preferred_contact_method')) || fields.get('fictional_data_only') !== 'on') throw new Error('Choose a contact preference and confirm fictional data only.');
 return {fictional_client_name:fields.get('name'), category:categories[fields.get('concern')], preferred_contact_method:fields.get('preferred_contact_method'), fictional_data_only:true};
}
async function inquiryApi(path, options = {}) {
 const controller = new AbortController();
 const timeout = setTimeout(() => controller.abort(), 10000);
 try {
  const response = await fetch('http://127.0.0.1:8000' + path, {...options, signal:controller.signal, credentials:'omit'});
  const data = await response.json();
  if (!response.ok) throw new Error((typeof data.detail === 'string' ? data.detail : 'The backend rejected the request.') + (data.errors ? ' ' + data.errors.map(e => e.field + ': ' + e.message).join('; ') : ''));
  return data;
 } catch (error) {
  if (error.name === 'AbortError' || error instanceof TypeError) throw new Error('Cannot reach the local backend. Start FastAPI on 127.0.0.1:8000 and check the local CORS setup. If a save timed out, check Saved inquiries before retrying.');
  throw error;
 } finally {clearTimeout(timeout);}
}
async function saveCounselingInquiry(form) {
 if (state.inquirySaving || state.bookingSubmitted) return;
 const fields = new FormData(form), counselor = state.bookingCounselor;
 const button = form.querySelector('button[type="submit"]');
 state.inquirySaving = true; state.inquirySaveError = '';
 if (button) {button.disabled = true; button.textContent = 'Saving fictional request…';}
 try {
  const saved = await inquiryApi('/api/inquiries', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(inquiryPayload(fields))});
  // Keep the existing role walkthrough available; only the inquiry is persistent.
  const request = {id:`demo-${state.demoRequests.length + 1}`, inquiryId:saved.inquiry_id, demo:true, name:saved.fictional_client_name, concern:fields.get('concern'), preferredCare:fields.get('concern'), format:fields.get('format'), preferredCounselorId:counselor.id, counselorId:null, appointment:null, status:'New', source:'Test inquiry', urgency:'Routine'};
  state.demoRequests.unshift(request); state.activeRequestId = request.id;
  state.managementLoaded = false; state.lastSavedInquiryId = saved.inquiry_id; state.savedInquiries = [saved, ...state.savedInquiries.filter(r => r.inquiry_id !== saved.inquiry_id)];
  state.bookingSubmitted = true;
  state.notice = 'Inquiry saved. Review it in Admin CRM → Clients. Appointment and care changes are session-only.';
 } catch (error) {state.inquirySaveError = 'Request was not confirmed saved. ' + error.message;}
 finally {
  state.inquirySaving = false; render();
  if (!state.bookingSubmitted) {
   const retryForm = document.querySelector('[data-booking-form]');
   if (retryForm) for (const [name, value] of fields.entries()) {
    const input = retryForm.elements.namedItem(name);
    if (input) {if (input.type === 'checkbox') input.checked = value === 'on'; else input.value = value;}
   }
  }
 }
}
function savedInquiryPanel() {
 if (!localInquiryBackend()) return '';
 return `<section class="panel" data-saved-inquiries><h2>Saved inquiries</h2><p>Saved inquiries remain after refresh. Assignment and scheduling below are session simulations.</p><button class="secondary-button" data-inquiry-refresh ${state.inquiriesLoading ? 'disabled' : ''}>Refresh saved inquiries</button><p role="status">${escapeHtml(state.inquiriesError || (state.inquiriesLoading ? 'Loading saved inquiries…' : `${state.savedInquiries.length} saved inquiries.`))}</p>${state.savedInquiries.map(r => `<article class="care-plan"><h3>${escapeHtml(r.fictional_client_name)}</h3><p>Inquiry ID: ${escapeHtml(r.inquiry_id)}</p><p>Category: ${escapeHtml(r.category)} · Contact preference: ${escapeHtml(r.preferred_contact_method)} · Status: ${escapeHtml(r.status)}</p><p>Created: ${escapeHtml(r.created_at)}</p></article>`).join('')}${!state.inquiriesLoading && !state.inquiriesError && !state.savedInquiries.length ? '<p>No saved inquiries yet.</p>' : ''}</section>`;
}
async function loadSavedInquiries() {
 if (state.inquiriesLoading || !localInquiryBackend()) return;
 state.inquiriesLoading = true; state.inquiriesLoaded = true; state.inquiriesError = ''; render();
 try {state.savedInquiries = await inquiryApi('/api/inquiries');}
 catch (error) {state.inquiriesError = 'Could not refresh saved inquiries. Previously loaded records may be stale. ' + error.message;}
 finally {state.inquiriesLoading = false; render();}
}
function bindSavedInquiryEvents() {

}
function displayRecordDate(value){return new Date(value).toLocaleString('en-US',{timeZone:'America/New_York',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});}
function crmSelect(label,scope,key,value,options){return `<label>${label}<select aria-label="${escapeHtml(label)}" data-crm-filter="${key}" data-crm-scope="${scope}">${options.map(([id,text])=>`<option value="${escapeHtml(id)}" ${id===value?'selected':''}>${escapeHtml(text)}</option>`).join('')}</select></label>`;}
function linkedSessionRecord(record){return state.demoRequests.find(r=>r.inquiryId===record.inquiry_id);}
function counselorLabel(id){return counselors.find(c=>c.id===id)?.name||'Not assigned';}
function recordActivity(record){const session=linkedSessionRecord(record);const events=[...(record.history||[]).map(e=>e.occurred_at),...(session?ensureOperations(session).notifications:[]).map(e=>e.at)];const timestamps=events.map(value=>Date.parse(value)).filter(Number.isFinite);return timestamps.length?Math.max(...timestamps):null;}
function compareActivity(a,b,descending){const left=recordActivity(a),right=recordActivity(b);if(left===null||right===null)return left===right?0:left===null?1:-1;return descending?right-left:left-right;}
function crmSortHeader(scope,label,ascending,descending){const current=state[scope==='clients'?'directoryFilters':'appointmentFilters'].sort;const active=current===ascending||current===descending;const direction=current===ascending?'ascending':'descending';return `<div role="columnheader" aria-sort="${active?direction:'none'}"><button type="button" class="column-sort" data-crm-sort="${ascending}" data-crm-desc="${descending}" data-crm-scope="${scope}">${label}<span aria-hidden="true">${active?(direction==='ascending'?'↑':'↓'):'↕'}</span></button></div>`;}
function crmDirectoryHeader(){return `<div class="directory-row directory-head" role="row">${crmSortHeader('clients','Name','az','za')}${crmSortHeader('clients','Status','status','statusdesc')}<div role="columnheader">Counselor</div>${crmSortHeader('clients','Last Activity','oldest','recent')}<div role="columnheader">Next action</div></div>`;}
function appointmentDirectoryHeader(){return `<div class="directory-row appointment-row directory-head" role="row">${crmSortHeader('appointments','Name','name','namedesc')}${crmSortHeader('appointments','Date','soonest','latest')}${crmSortHeader('appointments','Status','status','statusdesc')}<div role="columnheader">Action</div></div>`;}
function filteredManagedRecords(){
 const f=state.directoryFilters;
 const base=f.lifecycle==='all'?[...state.managedLists.prospective,...state.managedLists.established]:state.managedLists[state.activeAdminPanel==='established'?'established':'prospective'];
 const query=f.search.trim().toLowerCase();
 return base.filter(r=>(!query||[r.fictional_client_name,r.inquiry_id].some(v=>v.toLowerCase().includes(query)))&&(!f.category||r.category===f.category)&&(!f.portal||r.portal_status===f.portal)&&(!f.counselor||(linkedSessionRecord(r)?.counselorId||'unassigned')===f.counselor)).sort((a,b)=>{
  const name=a.fictional_client_name.localeCompare(b.fictional_client_name);
  const order=f.sort==='za'?-name:f.sort==='recent'?compareActivity(a,b,true):f.sort==='oldest'?compareActivity(a,b,false):f.sort==='newest'?Date.parse(b.created_at)-Date.parse(a.created_at):['status','statusdesc'].includes(f.sort)?(f.sort==='status'?1:-1)*(Number(Boolean(a.converted_at))-Number(Boolean(b.converted_at)))||name:name;
  return order||a.inquiry_id.localeCompare(b.inquiry_id);
 });
}

function filteredAppointments(ignoreDate=false){const f=state.appointmentFilters;const q=f.search.trim().toLowerCase();return appointmentRecords().filter(r=>(!q||[r.name,r.id,counselorLabel(r.counselor)].some(v=>v.toLowerCase().includes(q)))&&(!f.counselor||r.counselor===f.counselor)&&(!f.date||ignoreDate||r.date===f.date)&&(ignoreDate||f.view!=='calendar'||f.date||r.date.startsWith(f.month||demoToday().slice(0,7)))&&(!f.type||r.type===f.type)&&(!f.status||r.status===f.status)&&(!f.source||r.source===f.source)).sort((a,b)=>{if(['soonest','latest'].includes(f.sort)&&Boolean(a.date)!==Boolean(b.date))return a.date?-1:1;const dates=(a.date||'9999')+a.time;const other=(b.date||'9999')+b.time;return (f.sort==='name'?a.name.localeCompare(b.name):f.sort==='namedesc'?b.name.localeCompare(a.name):f.sort==='status'?a.status.localeCompare(b.status):f.sort==='statusdesc'?b.status.localeCompare(a.status):f.sort==='latest'?other.localeCompare(dates):dates.localeCompare(other))||a.id.localeCompare(b.id);});}
function calendarPreview(){const f=state.appointmentFilters;const month=f.month||demoToday().slice(0,7);const [year,m]=month.split('-').map(Number);const days=new Date(Date.UTC(year,m,0)).getUTCDate();const offset=(new Date(Date.UTC(year,m-1,1)).getUTCDay()+6)%7;const records=filteredAppointments(true);return `<section class="calendar-preview" aria-label="Appointment calendar preview"><label>Calendar month<input type="month" data-crm-filter="month" data-crm-scope="appointments" value="${escapeHtml(month)}" /></label><p class="record-meta">Eastern Time. Preview only; no live bookings.</p><div class="calendar-grid">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<span class="calendar-weekday">${d}</span>`).join('')}${Array.from({length:offset},()=>'<span></span>').join('')}${Array.from({length:days},(_,i)=>{const date=month+'-'+String(i+1).padStart(2,'0');const count=records.filter(r=>r.date===date).length;return `<button class="calendar-day ${f.date===date?'selected':''}" data-calendar-day="${date}" aria-label="${date}, ${count} appointments" aria-pressed="${f.date===date}"><strong>${i+1}</strong><small>${count||''}</small></button>`;}).join('')}</div></section>`;}
function appointmentsWorkspace(){const f=state.appointmentFilters;const rows=filteredAppointments();return panel('Appointments',`<p class="record-meta">Scheduling changes reset on refresh. No live bookings or reminders.</p><div class="crm-controls"><label class="crm-search">Search appointments<input type="search" data-crm-search="appointments" value="${escapeHtml(f.search)}" placeholder="Client, counselor, or reference" /></label>${crmSelect('Appointment counselor','appointments','counselor',f.counselor,[['','All counselors'],['unassigned','Not assigned'],...counselors.map(c=>[c.id,c.name])])}<label>Filter by date<input type="date" data-crm-filter="date" data-crm-scope="appointments" value="${escapeHtml(f.date)}" /></label>${crmSelect('Appointment type','appointments','type',f.type,[['','All types'],['Consultation (test)','Consultation (test)'],['Archived session','Archived session']])}${crmSelect('Appointment status','appointments','status',f.status,[['','All statuses'],...['Confirmed','Awaiting scheduling','Cancelled','Historical'].map(v=>[v,v])])}${crmSelect('Appointment source','appointments','source',f.source,[['session','Current session'],['historical','Archive'],['','All records']])}${crmSelect('Sort appointments','appointments','sort',f.sort,[['soonest','Earliest date'],['latest','Latest date'],['name','Client name A–Z'],['namedesc','Client name Z–A'],['status','Status'],['statusdesc','Status reversed']])}<button class="secondary-button" data-crm-clear="appointments">Clear filters</button></div><div class="button-row"><button class="secondary-button" data-appointment-view="list" aria-pressed="${f.view==='list'}">List view</button><button class="secondary-button" data-appointment-view="calendar" aria-pressed="${f.view==='calendar'}">Calendar preview</button></div>${f.view==='calendar'?calendarPreview():''}<p role="status">${rows.length} appointments shown.</p><div class="compact-directory" role="table" aria-label="Appointment results">${appointmentDirectoryHeader()}${rows.map(r=>`<article class="directory-row appointment-row" data-appointment-row role="row"><div role="cell"><strong>${escapeHtml(r.name)}</strong><small>${escapeHtml(r.type)}</small></div><div role="cell"><span>${escapeHtml(r.date||'Not scheduled')}${r.time?' at '+r.time:''}</span><small>Eastern Time${r.source==='historical'?' · historical example':''}</small></div><div role="cell"><span>${escapeHtml(counselorLabel(r.counselor))}</span><small>${escapeHtml(r.status)}</small></div><div role="cell"><button class="secondary-button" data-appointment-open="${escapeHtml(r.id)}">Review appointment</button></div></article>`).join('')}</div>${!rows.length?'<p>No appointments match these filters. Clear filters or create a session referral below.</p>':''}`);}
function bindCrmDirectoryEvents(){
 if(state.view!=='admin'||state.demoRole!=='Admin')return;
 document.querySelectorAll('[data-crm-sort]').forEach(el=>el.addEventListener('click',()=>{const f=state[el.dataset.crmScope==='clients'?'directoryFilters':'appointmentFilters'];const first=el.dataset.crmSort==='oldest'?'recent':el.dataset.crmSort;const second=first===el.dataset.crmSort?el.dataset.crmDesc:el.dataset.crmSort;f.sort=f.sort===first?second:first;state.managementNotice='';render();}));
 document.querySelectorAll('[data-crm-search]').forEach(input=>input.addEventListener('input',()=>{const scope=input.dataset.crmSearch;const position=input.selectionStart;state.managementNotice='';state[scope==='clients'?'directoryFilters':'appointmentFilters'].search=input.value;render();const next=document.querySelector(`[data-crm-search="${scope}"]`);next?.focus();next?.setSelectionRange(position,position);}));
 document.querySelectorAll('[data-crm-filter]').forEach(input=>input.addEventListener('change',()=>{const f=state[input.dataset.crmScope==='clients'?'directoryFilters':'appointmentFilters'];const key=input.dataset.crmFilter;state.managementNotice='';if(key==='lifecycle'&&input.value!=='all'){state.activeAdminPanel=input.value;f.lifecycle='section';}else f[key]=input.value;if(key==='month')f.date='';if(key==='date'&&input.value)f.month=input.value.slice(0,7);render();}));
 document.querySelectorAll('[data-crm-clear]').forEach(el=>el.addEventListener('click',()=>{if(el.dataset.crmClear==='clients')state.directoryFilters=defaultDirectoryFilters();else state.appointmentFilters=defaultAppointmentFilters();render();}));
 document.querySelectorAll('[data-appointment-view]').forEach(el=>el.addEventListener('click',()=>{state.appointmentFilters.view=el.dataset.appointmentView;if(state.appointmentFilters.view==='calendar'&&!state.appointmentFilters.month)state.appointmentFilters.month=demoToday().slice(0,7);render();}));
 document.querySelectorAll('[data-calendar-day]').forEach(el=>el.addEventListener('click',()=>{state.appointmentFilters.date=el.dataset.calendarDay;render();}));
 document.querySelectorAll('[data-appointment-open]').forEach(el=>el.addEventListener('click',()=>{const record=careRecords().find(r=>r.id===el.dataset.appointmentOpen);if(!record)return;state.appointmentReview=record.id;render();const target=document.querySelector('[data-appointment-review]');target?.scrollIntoView({block:'start'});target?.focus();}));
}
function appointmentReviewPanel(){const r=careRecords().find(r=>r.id===state.appointmentReview);return r?`<section class="panel" tabindex="-1" data-appointment-review><h2>${escapeHtml(r.name)} appointment</h2>${demoRequestSummary(r)}${rescheduleSummary(r)}${cancellationSummary(r)}${appointmentHistory(r)}<button class="secondary-button" data-appointment-close>Close appointment review</button></section>`:'';}
function defaultDirectoryFilters(){return {search:'',sort:'az',counselor:'',category:'',portal:'',lifecycle:'section'};}
function defaultAppointmentFilters(){return {search:'',sort:'soonest',counselor:'',date:'',type:'',status:'',source:'session',view:'list',month:''};}
Object.assign(state,{directoryFilters:defaultDirectoryFilters(),appointmentFilters:defaultAppointmentFilters(),appointmentReview:null});

function onboardingChecklist(record){
 const linked=linkedSessionRecord(record),care=linked?careDetails(linked):null;
 return [
  {key:'inquiry',label:'Inquiry',status:'Received',scope:'Saved',next:'Review the information above.'},
  {key:'conversion',label:'Client record',status:record.converted_at?'Established':'Prospective',scope:'Saved',next:record.converted_at?'Review outstanding onboarding steps.':'Confirm conversion when the center is ready.'},
  {key:'counselor',label:'Counselor assignment',status:linked?.counselorId?counselorLabel(linked.counselorId):'Not assigned',scope:'Session only',next:linked?.counselorId?'Review the assigned workspace.':linked?'Assign a counselor in Appointments.':'Persistent assignment is planned.'},
  {key:'intake',label:'Intake checklist',status:care?.intake.submitted?'Submitted':'Not started',scope:'Session only',next:care?.intake.submitted?'Review the checklist in the client workspace.':linked?'Complete the preset checklist in the client workspace.':'Persistent intake collection is not available yet.'},
  {key:'questionnaire',label:'Secure intake questionnaire',status:'Not available',scope:'Planned',next:'Requires authenticated access and protected intake storage.'},
  {key:'appointment',label:'Appointment',status:linked?.appointment&&!care?.cancelled?'Time selected':care?.cancelled?'Cancelled in this session':'Not scheduled',scope:'Session only',next:'Review scheduling in Appointments. No live booking is made.'},
  {key:'portal',label:'Portal invitation',status:record.portal_status==='Not Sent'?'Not recorded':record.portal_status+' (tracked)',scope:'Saved tracking',next:'Update tracking below. No invitation is sent or activation verified.'},
  {key:'communications',label:'Communications',status:'Not connected',scope:'Planned',next:'No messages or reminders are delivered.'}
 ];
}
function onboardingPanel(record){const steps=onboardingChecklist(record);const outstanding=steps.filter(step=>['Not assigned','Not started','Not scheduled','Not recorded'].includes(step.status));return `<section class="profile-section" data-onboarding-checklist><div class="section-toolbar"><h3>Onboarding checklist</h3><span class="record-badge">${outstanding.length} items to review</span></div><p class="record-meta">Inquiry details carry forward using this record's inquiry reference.</p><ol class="onboarding-checklist">${steps.map(step=>`<li data-onboarding-step="${step.key}"><div><strong>${step.label}</strong><span class="record-badge">${escapeHtml(step.status)}</span></div><small>${step.scope}</small><p>${escapeHtml(step.next)}</p></li>`).join('')}</ol>${linkedSessionRecord(record)?`<div class="button-row"><button class="secondary-button" data-onboarding-intake="${escapeHtml(record.inquiry_id)}">Open intake checklist</button><button class="secondary-button" data-onboarding-appointments="${escapeHtml(record.inquiry_id)}">Review assignment and appointments</button></div>`:""}<details><summary>Progress and availability</summary><p>Saved steps persist. Session-only steps reset on refresh and are linked by inquiry reference, not name. Secure questionnaires and communications are not available. Conversion and invitation tracking remain independent.</p></details></section>`;}
function activityDescription(event){const descriptions={'Original fictional inquiry received.':'Inquiry received.','Confirmed fictional conversion in the ELCCC local workflow.':'Client conversion confirmed.'};return descriptions[event.detail]||event.detail.replace(' → ',' to ');}

function managedClientsPanel() {
 const established = state.activeAdminPanel === 'established';
 const title = state.directoryFilters.lifecycle==='all'?'Client Directory':established ? 'Established Clients' : 'Prospective Clients';
 if (!localInquiryBackend()) return panel(title, '<p>Open the local frontend at http://127.0.0.1:5500 with the backend running to manage saved clients.</p>');
 const records = filteredManagedRecords();
 const total = state.directoryFilters.lifecycle==='all'?state.managedLists.prospective.length+state.managedLists.established.length:state.managedLists[established?'established':'prospective'].length;
 const profile = state.managedProfile;
 const profileMatches = profile && (state.directoryFilters.lifecycle==='all'||Boolean(profile.converted_at) === established);
 const disabled = state.managementSaving || state.managementLoading ? 'disabled' : '';
 return panel(title, `<div class="section-toolbar"><p>${established?'Converted clients and their onboarding activity.':'Review inquiries and prepare clients for onboarding.'}</p><button class="secondary-button" data-management-refresh ${disabled}>Refresh client lists</button></div><p class="workspace-status" role="status">${escapeHtml(state.managementError || state.managementNotice || (state.managementLoading ? 'Loading client lists…' : state.directoryFilters.lifecycle==='all'?`${records.length} clients.`:`${records.length} ${established ? 'established' : 'prospective'} clients.`))}</p>${state.managementError && records.length ? '<p>Previously loaded records may be stale.</p>' : ''}${clientDirectoryControls()}<div class="management-layout ${profileMatches?'has-profile':''}"><div class="managed-record-list">${managedDirectoryRows(records,disabled)}${state.managementLoaded && !state.managementLoading && !state.managementError && !records.length ? (total?'<p>No clients match the current filters.</p>':'<p>No ' + (established ? 'established' : 'prospective') + ' clients yet.</p>') : ''}</div>${profileMatches ? `<section class="managed-profile" data-managed-profile><header class="profile-heading"><p class="eyebrow dark">${profile.converted_at?'Established client':'Prospective client'} · Test record</p><h2 tabindex="-1">${escapeHtml(profile.fictional_client_name)} profile</h2><p class="record-meta">Original inquiry ID: ${escapeHtml(profile.inquiry_id)}</p><button class="link-button" data-management-close ${disabled}>Close profile</button></header><dl class="profile-facts"><div><dt>Counseling interest</dt><dd>${escapeHtml(profile.category)}</dd></div><div><dt>Contact preference</dt><dd>${escapeHtml(profile.preferred_contact_method)}</dd></div><div><dt>Received</dt><dd>${escapeHtml(displayRecordDate(profile.created_at))}</dd></div><div><dt>Client status</dt><dd>${profile.converted_at?'Established client':'Not converted to client.'}</dd></div></dl><details class="record-details"><summary>Original inquiry details</summary><p>Inquiry created: ${escapeHtml(profile.created_at)}</p><p>Original inquiry status: ${escapeHtml(profile.status)}</p>${profile.converted_at?`<p>Converted: ${escapeHtml(profile.converted_at)}</p>`:''}<p>Only the original inquiry information is available. No clinical intake or real contact details are stored.</p></details>${onboardingPanel(profile)}<section class="profile-section"><h3>Portal invitation</h3><p class="record-meta">Tracking only. No invitation is sent or account activation verified.</p><form class="invitation-form" data-portal-status="${escapeHtml(profile.inquiry_id)}"><label>Portal invitation status<select name="portal_status">${['Not Sent','Sent','Activated'].map(status => `<option ${status === profile.portal_status ? 'selected' : ''}>${status}</option>`).join('')}</select></label><button class="secondary-button" type="submit" ${disabled}>Save invitation tracking</button></form></section><section class="profile-section"><h3>${profile.converted_at?'Conversion complete':'Client conversion'}</h3>${!profile.converted_at ? (state.confirmConversion === profile.inquiry_id ? `<div class="conversion-confirmation" role="group" aria-label="Confirm client conversion"><p>Convert ${escapeHtml(profile.fictional_client_name)} to an established client?</p><p class="record-meta">The inquiry and history stay saved. No external account or invitation is created.</p><div class="button-row"><button class="lime-button" data-management-confirm="${escapeHtml(profile.inquiry_id)}" ${disabled}>Confirm Conversion</button><button class="secondary-button" data-management-cancel ${disabled}>Cancel Conversion</button></div></div>` : `<p class="record-meta">Move this record to Established Clients. Invitation tracking is independent.</p><button class="lime-button" data-management-convert="${escapeHtml(profile.inquiry_id)}" ${disabled}>Convert to Client</button>`) : `<p>Converted ${escapeHtml(displayRecordDate(profile.converted_at))}. The original inquiry is preserved.</p>`}</section><section class="profile-section"><h3>Activity history</h3><ol class="activity-history">${profile.history.slice().sort((a,b)=>Date.parse(a.occurred_at)-Date.parse(b.occurred_at)).map(event => `<li><strong>${escapeHtml(event.action)}</strong><time>${escapeHtml(displayRecordDate(event.occurred_at))}</time><span>${escapeHtml(activityDescription(event))}</span></li>`).join('')}</ol></section></section>` : ''}</div>`);
}
async function loadManagedClients() {
 if (!localInquiryBackend() || state.managementLoading || state.managementSaving) return;
 state.managementLoading = true; state.managementError = ''; state.managementNotice = ''; render();
 try {
  const [prospective, established] = await Promise.all([inquiryApi('/api/prospective-clients'), inquiryApi('/api/clients')]);
  state.managedLists = {prospective, established}; state.managementLoaded = true;
  if (state.managedProfile) state.managedProfile = [...prospective, ...established].find(r => r.inquiry_id === state.managedProfile.inquiry_id) || null;
 } catch (error) {state.managementError = 'Could not load client lists. ' + error.message; state.managementLoaded = true;}
 finally {state.managementLoading = false; render();}
}
async function openManagedProfile(id) {
 if (state.managementSaving || state.managementLoading) return;
 state.managementSaving = true; state.managementError = ''; state.managementNotice = 'Loading profile…'; state.managedProfile = null; state.confirmConversion = null; render();
 try {state.managedProfile = await inquiryApi('/api/inquiries/' + encodeURIComponent(id) + '/management'); state.managementNotice = '';}
 catch (error) {state.managementError = 'Could not open profile. ' + error.message; state.managementNotice = '';}
 finally {state.managementSaving = false; render(); const heading=document.querySelector('[data-managed-profile] h2');heading?.focus({preventScroll:true}); if(window.innerWidth<900)heading?.scrollIntoView({block:'start'});}
}
async function updateManagedProfile(id, action, payload) {
 if (state.managementSaving || state.managementLoading || state.demoRole !== 'Admin' || !localInquiryBackend()) return;
 state.managementSaving = true; state.managementError = ''; state.managementNotice = 'Saving local record…'; render();
 try {
  const record = await inquiryApi('/api/inquiries/' + encodeURIComponent(id) + '/' + action, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  state.managedProfile = record; state.confirmConversion = null;
  for (const key of ['prospective','established']) state.managedLists[key] = state.managedLists[key].filter(r => r.inquiry_id !== id);
  state.managedLists[record.converted_at ? 'established' : 'prospective'].unshift(record);
  if (action === 'convert') state.activeAdminPanel = 'established';
  state.managementNotice = action === 'convert' ? 'Conversion saved. This record is now an established client.' : 'Invitation tracking saved locally. No invitation was sent and no MYIO account was verified.';
 } catch (error) {state.managementError = 'Change was not confirmed saved. Refresh the lists before retrying. ' + error.message; state.managementNotice = '';}
 finally {state.managementSaving = false; render(); const heading=document.querySelector('[data-managed-profile] h2');heading?.focus({preventScroll:true}); if(window.innerWidth<900)heading?.scrollIntoView({block:'start'});}
}
function bindManagementEvents() {
 if (!localInquiryBackend() || state.view !== 'admin' || state.demoRole !== 'Admin') return;
 document.querySelectorAll('[data-onboarding-intake]').forEach(el=>el.addEventListener('click',()=>{const record=[...state.managedLists.prospective,...state.managedLists.established].find(r=>r.inquiry_id===el.dataset.onboardingIntake);const linked=record&&linkedSessionRecord(record);if(!linked)return;state.activeRequestId=linked.id;navigateDemoView('client');document.querySelector('[data-sample-intake]')?.scrollIntoView({block:'center'});}));
 document.querySelectorAll('[data-onboarding-appointments]').forEach(el=>el.addEventListener('click',()=>{const record=[...state.managedLists.prospective,...state.managedLists.established].find(r=>r.inquiry_id===el.dataset.onboardingAppointments);const linked=record&&linkedSessionRecord(record);if(!linked)return;state.activeAdminPanel='appointments';state.appointmentReview=linked.id;state.appointmentFilters=defaultAppointmentFilters();state.appointmentFilters.search=linked.id;render();}));
 document.querySelectorAll('[data-management-refresh]').forEach(el => el.addEventListener('click', () => {state.managementNotice = ''; loadManagedClients();}));
 document.querySelectorAll('[data-management-open]').forEach(el => el.addEventListener('click', () => openManagedProfile(el.dataset.managementOpen)));
 document.querySelectorAll('[data-management-close]').forEach(el => el.addEventListener('click', () => {state.managedProfile = null; state.confirmConversion = null; render();}));
 document.querySelectorAll('[data-management-convert]').forEach(el => el.addEventListener('click', () => {state.confirmConversion = el.dataset.managementConvert; render();}));
 document.querySelectorAll('[data-management-cancel]').forEach(el => el.addEventListener('click', () => {state.confirmConversion = null; render();}));
 document.querySelectorAll('[data-management-confirm]').forEach(el => el.addEventListener('click', () => {if (state.confirmConversion === el.dataset.managementConfirm) updateManagedProfile(el.dataset.managementConfirm, 'convert', {confirmed:true});}));
 document.querySelectorAll('[data-portal-status]').forEach(form => form.addEventListener('submit', event => {event.preventDefault(); updateManagedProfile(form.dataset.portalStatus, 'portal-status', {portal_status:new FormData(form).get('portal_status')});}));
 if (['prospective','established'].includes(state.activeAdminPanel) && !state.managementLoaded && !state.managementLoading) loadManagedClients();
}
Object.assign(state, {managedLists:{prospective:[], established:[]}, managedProfile:null, managementLoaded:false, managementLoading:false, managementSaving:false, managementError:'', managementNotice:'', confirmConversion:null});

Object.assign(state, {savedInquiries:[], inquiriesLoaded:false, inquiriesLoading:false, inquiriesError:'', inquirySaving:false, inquirySaveError:'', lastSavedInquiryId:''});

let dialogReturnFocus = null;
function setupDialogAccessibility(focusAttribute, focusValue, hadDialog) {
 const modal = document.querySelector('.modal-backdrop');
 document.querySelectorAll('.site-header, main, .site-footer').forEach(el => { el.inert = Boolean(modal); });
 if (document.body) document.body.style.overflow = modal ? 'hidden' : '';
 if (modal) {
  if (!hadDialog) dialogReturnFocus = {attribute: focusAttribute, value: focusValue};
  const title = modal.querySelector('h2');
  if (title) { title.id = 'dialog-title'; modal.setAttribute('aria-labelledby', title.id); }
  const controls = [...modal.querySelectorAll('button, input, select, textarea, a[href]')];
  const retained = controls.find(el => focusAttribute && el.getAttribute(focusAttribute) === focusValue);
  (retained || controls[0])?.focus();
 } else {
  const target = hadDialog ? dialogReturnFocus : {attribute: focusAttribute, value: focusValue};
  const retained = target?.attribute ? [...document.querySelectorAll('[' + target.attribute + ']')].find(el => el.getAttribute(target.attribute) === target.value) : null;
  if (!hadDialog && ['data-view', 'data-workflow-go', 'data-login-continue', 'data-welcome-role', 'data-visitor'].includes(focusAttribute)) document.querySelector('main')?.focus();
  else retained?.focus();
 }
}
if (document.addEventListener) document.addEventListener('keydown', event => {
 const modal = document.querySelector('.modal-backdrop');
 if (!modal) {
  if (event.key === 'Escape' && state.menuOpen) { state.menuOpen = false; render(); document.querySelector('[data-menu-toggle]')?.focus(); }
  return;
 }
 if (event.key === 'Escape') {
  event.preventDefault(); state.selectedCounselor = null; state.selectedClient = null; state.bookingCounselor = null; state.showLogin = false; state.showPresentation = false; render(); return;
 }
 if (event.key === 'Tab') {
  const controls = [...modal.querySelectorAll('button, input, select, textarea, a[href]')].filter(el => !el.disabled && el.getClientRects().length);
  const first = controls[0], last = controls[controls.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
 }
});

render();
