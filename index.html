 :root { --cloud: #f7fbfc; --white: #ffffff; --mist: #e7f0f4; --mist-2: #d7e6ec; --blue-gray: #6f8795; --slate: #294557; --deep: #172b36; --ink: #10232d; --lime: #a7d943; --lime-2: #d9fb79; --lime-dark: #5f7f17; --sand: #f6dfa7; --rose: #f8d7da; --card: rgba(255, 255, 255, 0.94); --shadow: 0 18px 48px rgba(23, 43, 54, 0.12); --shadow-soft: 0 10px 30px rgba(23, 43, 54, 0.08); --radius-xl: 34px; --radius-lg: 24px; --radius-md: 18px; }
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-width: 320px;

  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background:
    radial-gradient(circle at top left, rgba(167, 217, 67, 0.12), transparent 26rem),
    linear-gradient(180deg, #eef7fb 0%, #f8fbfc 38%, #e8f1f5 100%);
}

button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }
h1, h2, h3, h4, p { margin-top: 0; }
p { color: rgba(16, 35, 45, 0.76); line-height: 1.7; }
h1, h2, h3, h4 { color: var(--deep); }
h1 { font-size: clamp(3rem, 7vw, 6.4rem); letter-spacing: -0.075em; line-height: 0.9; margin-bottom: 24px; }
h2 { font-size: clamp(2rem, 4vw, 4rem); letter-spacing: -0.055em; line-height: 1.02; margin-bottom: 16px; }
h3 { letter-spacing: -0.03em; }

.app-shell { min-height: 100vh; overflow-x: hidden; }

.demo-banner {
  background: linear-gradient(90deg, var(--deep), var(--slate));
  color: white;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.01em;
  padding: 10px 18px;
  text-align: center;
}

.site-header {
  align-items: center;
  backdrop-filter: blur(22px);
  background: rgba(248, 251, 252, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.82);

  display: flex;
  gap: 24px;
  justify-content: space-between;
  left: 50%;
  max-width: 1180px;
  padding: 14px 18px;
  position: sticky;
  top: 16px;
  transform: translateX(-50%);
  width: calc(100% - 32px);
  z-index: 10;
}

.brand {
  align-items: center;
  background: transparent;
  border: 0;
  color: var(--slate);
  display: flex;
  gap: 10px;
  min-width: max-content;
}
.brand-mark {
  align-items: center;

}
.brand strong, .brand small { display: block; line-height: 1.05; text-align: left; }
.brand small { color: var(--blue-gray); font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }

.mobile-menu-button {
  display: none;

  border-radius: 14px;
  color: white;
  font-weight: 900;

  padding: 11px 13px;
}
.hamburger {
  display: inline-grid;
  gap: 4px;
  width: 18px;
}
.hamburger span {
  background: white;
  border-radius: 99px;
  display: block;
  height: 2px;
}

.nav-pills {
  align-items: center;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}
.nav-pills button, .filter-row button, .quiz-field button, .admin-tabs button, .role-button {

}
.nav-pills button.active,
.nav-pills button:hover,
.filter-row button.active,
.quiz-field button.active,
.admin-tabs button.active,

  transform: translateY(-1px);
}

.cloud-panel {
  background:
    linear-gradient(135deg, rgba(12, 31, 42, 0.52), rgba(12, 31, 42, 0.7)),
    radial-gradient(circle at 14% 18%, rgba(255,255,255,0.95) 0 10%, transparent 24%),
    radial-gradient(circle at 72% 7%, rgba(255,255,255,0.72) 0 11%, transparent 30%),
    radial-gradient(circle at 88% 64%, rgba(167,217,67,0.24) 0 12%, transparent 28%),

  overflow: hidden;
  position: relative;
}
.cloud-panel::after {
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
  content: "";
  height: 100%;
  left: -30%;
  position: absolute;
  top: 0;
  transform: skewX(-18deg);
  width: 28%;
}
.cloud-panel h1,
.cloud-panel h2,
.cloud-panel h3,
.cloud-panel p {
  color: white;
  text-shadow: 0 2px 18px rgba(0,0,0,0.28);
}

.hero {
  align-items: center;
  border-radius: 0 0 56px 56px;
  display: grid;
  gap: 40px;
  grid-template-columns: 1.18fr 0.82fr;
  margin-top: -78px;
  min-height: 760px;
  padding: 160px max(28px, calc((100vw - 1180px) / 2)) 80px;
}
.hero-copy, .hero-card, .compact-cloud > * { position: relative; z-index: 1; }
.hero-copy > p:last-of-type { font-size: 20px; max-width: 720px; }

.eyebrow {
  color: rgba(255,255,255,0.9);

  font-weight: 900;
  letter-spacing: 0.16em;
  margin: 0 0 14px;

}

}

.cta-row { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
.lime-button, .ghost-button, .secondary-button {

}
.lime-button {

  box-shadow: 0 18px 34px rgba(167, 217, 67, 0.34);
  color: #17320d;
}
.lime-button:hover, .ghost-button:hover, .secondary-button:hover { transform: translateY(-2px); }
.ghost-button {
  background: rgba(255,255,255,0.16);
  border: 1px solid rgba(255,255,255,0.36);
  color: white;
}
.secondary-button {
  background: var(--slate);
  color: white;
}
.full { width: 100%; }

.glass-card {
  backdrop-filter: blur(22px);
  background: rgba(15, 35, 47, 0.38);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 34px;

}
.hero-card h3 { color: white; font-size: 44px; line-height: 1; margin: 22px 0 12px; }
.live-dot {
  background: var(--lime);
  border-radius: 50%;

  margin-right: 8px;
  width: 10px;
}
.mini-stack { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
.mini-stack span, .tags span {
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.24);
  border-radius: 999px;
  color: white;
  padding: 8px 11px;
}

.section, .page-wrap, .dashboard-shell {
  margin: 0 auto;
  max-width: 1180px;
  padding: 70px 24px;
}
.grid-3 { display: grid; gap: 22px; grid-template-columns: repeat(3, 1fr); }
.feature-card, .metric-card, .panel, .resource-card, .counselor-card, .team-card, .info-block, .prayer-card {
  background: var(--card);
  border: 1px solid rgba(255, 255, 255, 0.86);
  border-radius: 30px;
  box-shadow: var(--shadow-soft);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}
.feature-card:hover, .metric-card:hover, .resource-card:hover, .counselor-card:hover, .team-card:hover {
  box-shadow: var(--shadow);
  transform: translateY(-3px);
}
.feature-card { padding: 30px; }
.feature-card span { color: var(--lime-dark); font-size: 28px; }

.presentation-section {
  align-items: center;
  display: grid;
  gap: 34px;
  grid-template-columns: 0.9fr 1.1fr;
}
.analytics-preview {
  background: linear-gradient(135deg, rgba(41,69,87,0.98), rgba(111,135,149,0.92));
  border-radius: 38px;
  box-shadow: var(--shadow);
  display: grid;
  gap: 16px;
  grid-template-columns: 1fr 1fr;
  padding: 24px;
}
.analytics-preview .bar-chart { grid-column: 1 / -1; height: 190px; }
.analytics-preview .metric-card {
  background: rgba(255,255,255,0.14);
  border-color: rgba(255,255,255,0.24);
}
.analytics-preview .metric-card span,
.analytics-preview .metric-card p,
.analytics-preview .metric-card strong {
  color: white;
}

.section-heading { margin-bottom: 26px; max-width: 760px; }
.team-strip { display: grid; gap: 18px; grid-template-columns: repeat(6, 1fr); }
.team-card {
  border: 0;
  color: var(--slate);
  padding: 18px;
  text-align: left;
}

.avatar {
  align-items: center;
  aspect-ratio: 1;
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,0.72), transparent 36%),
    linear-gradient(135deg, var(--slate), var(--blue-gray));
  border: 5px solid rgba(255,255,255,0.8);
  border-radius: 50%;
  box-shadow: 0 18px 36px rgba(41, 69, 87, 0.18);
  color: white;
  display: grid;
  font-size: clamp(1.6rem, 4vw, 2.6rem);
  font-weight: 950;
  letter-spacing: -0.08em;
  margin-bottom: 14px;
  place-items: center;
  position: relative;
  text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  width: 100%;
}
.avatar::after {
  content: "✦";
  align-items: center;
  background: linear-gradient(135deg, var(--lime), var(--lime-2));
  border-radius: 50%;
  bottom: 6%;
  box-shadow: 0 6px 18px rgba(167, 217, 67, 0.32);
  color: #17320d;
  display: grid;
  font-size: 0.42em;
  height: 28%;
  place-items: center;
  position: absolute;
  right: 4%;
  width: 28%;
}
.avatar.sm {
  font-size: 1.05rem;
  height: 56px;
  margin: 0;
  min-width: 56px;
  width: 56px;
}
.avatar.modal-avatar {
  font-size: 3.6rem;
  height: 220px;
  margin: 0;
  width: 220px;
}
.team-card strong, .team-card span, .team-card small {
  display: block;
  margin-top: 8px;
}
.team-card span { color: var(--blue-gray); font-weight: 700; }
.team-card small { color: rgba(16,35,45,0.68); line-height: 1.4; }

.compact-cloud {
  align-items: center;
  border-radius: 44px;
  display: grid;
  gap: 30px;
  grid-template-columns: 1fr 420px;
  padding: 44px;
}
.prayer-card { display: grid; gap: 12px; padding: 22px; }
input, select, textarea {
  background: white;
  border: 1px solid rgba(111,135,149,0.28);
  border-radius: 18px;
  color: var(--slate);
  padding: 14px 16px;
  width: 100%;
}
textarea { min-height: 110px; resize: vertical; }

.page-hero { border-radius: 42px; margin-bottom: 28px; padding: 52px; }
.page-hero h1 { font-size: clamp(2.6rem, 5vw, 5rem); }
.filter-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }

.counselor-grid { display: grid; gap: 22px; grid-template-columns: repeat(3, 1fr); }
.counselor-card { overflow: hidden; padding: 22px; }
.card-body { padding-top: 12px; }
.between { align-items: center; display: flex; gap: 12px; justify-content: space-between; }
.credential-line { color: var(--blue-gray); font-weight: 800; }
.credential-line.white { color: rgba(255,255,255,0.86); }
.status { border-radius: 999px; font-size: 12px; font-weight: 900; padding: 6px 10px; }
.status.green { background: #eef8d8; color: #557414; }
.status.muted { background: #edf1f3; color: var(--blue-gray); }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
.tags span {
  background: #eef5f7;
  border-color: rgba(111,135,149,0.14);
  color: var(--slate);
  font-size: 12px;
  font-weight: 800;
}
.tags.light span { background: rgba(255,255,255,0.2); color: white; }

.modal-backdrop {
  align-items: center;
  background: rgba(10, 23, 31, 0.64);
  display: flex;
  inset: 0;
  justify-content: center;
  padding: 24px;
  position: fixed;
  z-index: 30;
}
.profile-modal, .dialog-modal {
  background: var(--cloud);
  border-radius: 36px;
  box-shadow: 0 30px 90px rgba(0,0,0,0.28);
  max-height: 92vh;
  max-width: 940px;
  overflow: auto;
  position: relative;
  width: 100%;
}
.dialog-modal { max-width: 760px; padding: 30px; }
.close-button {
  background: rgba(255,255,255,0.92);
  border: 0;
  border-radius: 50%;
  color: var(--deep);
  font-size: 28px;
  height: 44px;
  position: absolute;
  right: 18px;
  top: 18px;
  width: 44px;
  z-index: 1;
}
.profile-hero {
  align-items: center;
  background: linear-gradient(135deg, var(--slate), var(--blue-gray));
  color: white;
  display: grid;
  gap: 28px;
  grid-template-columns: 220px 1fr;
  padding: 36px;
}
.profile-hero h2 { color: white; }
.profile-content {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(2, 1fr);
  padding: 26px;
}
.info-block { padding: 22px; }

.form-grid {
  display: grid;
  gap: 14px;
  grid-template-columns: 1fr 1fr;
}
.form-grid .full-row { grid-column: 1 / -1; }
.confirmation {
  background: #eef8d8;
  border: 1px solid rgba(95, 127, 23, 0.22);
  border-radius: 18px;
  color: #38520b;
  display: none;
  font-weight: 800;
  margin-top: 16px;
  padding: 14px;
}
.confirmation.show { display: block; }

.login-role-grid {
  display: grid;
  gap: 14px;
  grid-template-columns: repeat(3, 1fr);
  margin: 22px 0;
}
.role-card {
  background: white;
  border: 1px solid rgba(111,135,149,0.22);
  border-radius: 22px;
  padding: 18px;
  text-align: center;
  transition: 0.2s ease;
}
.role-card:hover {
  border-color: var(--lime-dark);
  box-shadow: var(--shadow-soft);
  transform: translateY(-2px);
}

.quiz-layout { display: grid; gap: 28px; grid-template-columns: 1fr 380px; }
.quiz-field { border: 0; display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 22px; padding: 0; }
.quiz-field legend { color: var(--slate); font-size: 18px; font-weight: 900; margin-bottom: 12px; }
.recommendation-card {
  align-self: start;
  background: linear-gradient(150deg, rgba(41,69,87,0.98), rgba(111,135,149,0.92));
  color: white;
  position: sticky;
  top: 112px;
}
.recommendation-card h2,
.recommendation-card p {
  color: white;
}
.score-ring {
  align-items: center;
  background: radial-gradient(circle, rgba(255,255,255,0.12) 56%, var(--lime) 58%);
  border-radius: 50%;
  display: grid;
  font-size: 28px;
  font-weight: 900;
  height: 132px;
  margin: 20px auto;
  place-items: center;
  width: 132px;
}

.resource-grid { display: grid; gap: 18px; grid-template-columns: repeat(4, 1fr); }
.resource-card { padding: 22px; }
.resource-card span {
  color: var(--lime-dark);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.resource-tools {
  align-items: center;
  display: grid;
  gap: 12px;
  grid-template-columns: 1fr 240px auto;
  margin-bottom: 22px;
}
.resource-tools strong {
  background: var(--slate);
  border-radius: 999px;
  color: white;
  padding: 12px 16px;
  text-align: center;
}

.dashboard-shell { max-width: 1320px; }
.dashboard-hero {
  align-items: center;
  background: linear-gradient(135deg, var(--slate), #718b99);
  border-radius: 42px;
  box-shadow: var(--shadow);
  color: white;
  display: flex;
  justify-content: space-between;
  margin-bottom: 24px;
  padding: 44px;
}
.dashboard-hero h1, .dashboard-hero p { color: white; }
.dashboard-hero h1 { font-size: clamp(2.4rem, 5vw, 4.8rem); }

.dashboard-grid {
  display: grid;
  gap: 18px;
  grid-template-columns: repeat(4, 1fr);
  margin-bottom: 18px;
}
.dashboard-grid.five { grid-template-columns: repeat(5, 1fr); }
.metric-card { padding: 22px; position: relative; overflow: hidden; }
.metric-card::before {
  background: radial-gradient(circle, rgba(167,217,67,0.28), transparent 60%);
  content: "";
  height: 120px;
  position: absolute;
  right: -50px;
  top: -50px;
  width: 120px;
}
.metric-card span {
  color: var(--blue-gray);
  font-size: 12px;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.metric-card strong {
  color: var(--slate);
  display: block;
  font-size: 42px;
  letter-spacing: -0.06em;
  line-height: 1;
  margin: 14px 0 8px;
}
.metric-card em {
  background: #eef8d8;
  border-radius: 999px;
  color: #587a14;
  display: inline-block;
  font-size: 12px;
  font-style: normal;
  font-weight: 900;
  padding: 6px 10px;
}

.chart-grid { display: grid; gap: 18px; grid-template-columns: 1.3fr 0.9fr 1fr; margin-bottom: 18px; }
.two-column { display: grid; gap: 18px; grid-template-columns: 1fr 1fr; }
.panel { padding: 22px; }
.panel-title { align-items: center; display: flex; justify-content: space-between; margin-bottom: 16px; }
.panel-title span { color: var(--blue-gray); font-size: 12px; font-weight: 800; }

.bar-chart { align-items: end; display: flex; gap: 14px; height: 240px; }
.bar-item { align-items: center; display: flex; flex: 1; flex-direction: column; gap: 8px; height: 100%; justify-content: end; }
.bar-item div { background: linear-gradient(180deg, var(--lime), #6f8795); border-radius: 999px 999px 8px 8px; min-height: 18px; width: 100%; }
.bar-item span, .bar-item strong { color: var(--blue-gray); font-size: 12px; }
.donut-wrap { align-items: center; display: grid; gap: 20px; grid-template-columns: 150px 1fr; }
.donut {
  aspect-ratio: 1;
  background: conic-gradient(var(--lime) 0 38%, #7aa6b5 38% 62%, #294557 62% 80%, #dceaf0 80% 100%);
  border-radius: 50%;
  position: relative;
}
.donut::after {
  background: var(--cloud);
  border-radius: 50%;
  content: "";
  inset: 30px;
  position: absolute;
}
.legend-dot { background: var(--lime); border-radius: 50%; display: inline-block; height: 10px; margin-right: 8px; width: 10px; }

.hbars, .util-list, .table-list, .list { display: grid; gap: 12px; }
.hbars > div, .util-list > div { align-items: center; display: grid; gap: 10px; grid-template-columns: 100px 1fr 42px; }
.hbars div div, .util-list div div { background: #e9f1f5; border-radius: 999px; height: 12px; overflow: hidden; }
.hbars i, .util-list i { background: linear-gradient(90deg, var(--lime), #7192a1); border-radius: inherit; display: block; height: 100%; }
.table-list > div {
  align-items: center;
  background: #f7fafb;
  border-radius: 18px;
  display: grid;

eted':'Complete Fictional Follow-up'}</button>`:''}</div></article>`).join('')}</div>`;} function clientDirectory(){const records=careRecords();const selected=records.find(r=>r.id===state.profileClientId)||records[0];return `<p>Choose a fictional profile to inspect its own counselor, appointment, intake, and care activities.</p><label>Admin fictional profile<select data-admin-profile>${records.map(r=>`<option value="${r.id}" ${r.id===selected.id?'selected':''}>${escapeHtml(r.name)} · ${r.demo?'Session referral':'Historical sample'}</option>`).join('')}</select></label><div class="resource-grid">${[selected].map(r=>`<article class="care-plan"><h3>${escapeHtml(r.name)}</h3><p>${r.demo?'Session-created referral':'Historical fictional sample'} · ${friendlyRecordLabel(r)}</p>${demoRequestSummary(r)}<button class="secondary-button" data-profile-details="${r.id}">View Profile Details</button><button class="secondary-button" data-admin-followup="${r.id}">${r.adminFollowed?'Follow-up Completed':'Complete Administrative Follow-up'}</button>${state.profileDetails===r.id?`<div>${info('Intake',careDetails(r).intake.submitted?'Submitted':'Pending')}${info('Homework',careDetails(r).homework.length+' assigned')}${r.counselorId?`<button class="lime-button" data-open-care="${r.id}">Open Counselor Workspace</button>`:'<p>Assign a counselor in Appointment Requests first.</p>'}</div>`:''}</article>`).join('')}</div>`;} function clientProfileModal(client) { const careRecord=careRecords().find(r=>r.id===`sample-${client.id}`); const nextAppointment=careRecord.appointment ? `${careRecord.appointment.date} at ${careRecord.appointment.time}` : careRecord.sampleAppointment || "Cancelled — no confirmed appointment"; const counselor = counselors.find((item) => item.id === client.counselorId) || counselors[0]; return `<div class="modal-backdrop" role="dialog" aria-modal="true"><article class="profile-modal client-modal"><button class="close-button" aria-label="Close dialog" data-close-client>×</  function presentationModal() { return `<div class="modal-backdrop" role="dialog" aria-modal="true"><article class="dialog-modal"><button class="close-button" aria-label="Close dialog" data-presentation-close>×</button><p class="eyebrow dark">Executive Summary</p><h2>ELCCC Care Connect Presentation Brief</h2><div class="presentation-list"><article><h4>Product overview</h4><p>A unified public website, client portal, counselor workspace, and admin CRM prototype for care coordination.</p></article><article><h4>Client-facing features</h4><p>Find a counselor, match quiz, appointment requests, prayer requests, resources, forms, messages, and profile management.</p></article><article><h4>Counselor dashboard</h4><p>Assigned clients, schedule, tasks, new referrals, follow-up tracking, and caseload visibility.</p></article><article><h4>Admin CRM</h4><p>Lead management, counselor assignment, care journey Kanban, appointment queues, prayer management, and reporting.</p></article><article><h4>Future roadmap</h4><p>Authentication, HIPAA-grade storage, scheduling integration, secure messaging, billing, analytics, and audit logs.</p></article><article><h4>Demo disclaimer</h4><p>Prototype only — no real client or medical data. All records, dashboards, and workflows use mock data.</p></article></div></article></div>`; } function footer() { return `<footer class="site-footer"><p><strong>ELCCC Care Connect Prototype</strong> • Built for stakeholder demonstration • No real client or medical data.</p><p>Prototype by Danyel Fluker.</p></footer>`; } function recommendCounselor(answers) { return counselors.map((counselor) => { let score = counselor.acceptingNew ? 20 : 0; if (counselor.specialties.includes(answers.concern)) score += 40; if (counselor.populations.includes(answers.person) || (answers.person === "Couple" && counselor.populations.includes("Couples"))) score += 20; if (answers.location === "Any" || counselor.location === answers.location) score += 15; if (counselor.faithApproach.toLowerCase().includes(answers.faith.toLowerCase())) score += 5; return { counselor, score }; }).sort((a, b) => b.score - a.score)[0].counselor; } function avatar(person, extra = "") { return `<div class="avatar ${extra}" aria-label="${person.name} avatar">${initials(person.name)}</div>`; } function feature(title, text) { return `<article class="feature-card"><span>✦</span><h3>${title}</h3><p>${text}</p></article>`; } function teamCard(counselor) { return `<button class="team-card" data-counselor="${counselor.id}">${avatar(counselor)}<strong>${counselor.name}</strong><span>${counselor.credentials}</span><small>${counselor.specialties.slice(0, 2).join(" • ")}</small></button>`; } function counselorCard(counselor) { return `<article class="counselor-card">${avatar(counselor)}<div class="card-body"><div class="between"><h3>${counselor.name}</h3><span class="${counselor.acceptingNew ? "status green" : "status muted"}">${counselor.acceptingNew ? "Open" : "Waitlist"}</span></div><p class="credential-line">${counselor.credentials} · ${counselor.role}</p><p>${counselor.bio}</p><div class="tags">${counselor.specialties.slice(0, 4).map((tag) => `<span>${tag}</span>`).join("")}</div><button class="lime-button full" data-counselor="${counselor.id}">View Profile</button></div></article>`; } function quizField(label, key, options) { return `<fieldset class="quiz-field"><legend>${label}</legend>${options.map((option) => `<button type="button" data-quiz-key="${key}" data-quiz-value="${option}" class="${state.quiz[key] === option ? "active" : ""}">${option}</button>`).join("")}</fieldset>`; } function resourceCard(resource) { return `<article class="resource-card"><span>${resource.category}</span><h3>${resource.title}</h3><p>${resource.audience} · ${resource.readTime}</p></article>`; } function compactResource(resource) { return `<p class="compact-resource"><strong>${resource.title}</strong><span>${resource.category} · ${resource.readTime}</span></p>`; } function pageHero(eyebrow, title, text) { return `<div class="page-hero cloud-panel"><p class="eyebrow">${eyebrow}</p><h1>${title}</h1><p>${text}</p></div>`; } function metric(label, value, detail, trend = "") { return `<article class="metric-card"><span>${label}</span><strong>${value}</strong><p>${detail}</p>${trend ? `<em>${trend}</em>` : ""}</article>`; } function panel(title, body) { return `<section class="panel" id="area-${title.toLowerCase().replace(/[^a-z0-9]+/g,'-')}"><div class="panel-title"><h3>${title}</h3><span>Mock data</span></div>${body}</section>`; } function dashboardLayout(title, subtitle, children) { return `<section class="dashboard-shell"><div class="dashboard-hero"><div><p class="eyebrow">ELCCC Care Connect</p><h1>${title}</h1><p>${subtitle}</p></div><button class="lime-button" data-presentation-open>Export Presentation</button></div>${children}</section>`; } function barChart(data) { const max = Math.max(...data.map((item) => item.value)); return `<div class="bar-chart">${data.map((item) => `<div class="bar-item"><div style="height:${(item.value / max) * 100}%"></div><span>${item.month}</span><strong>${item.value}</strong></div>`).join("")}</div>`; } function donutChart(data) { return `<div class="donut-wrap"><div class="donut"></div><div>${data.map((item) => `<p><span class="legend-dot"></span>${item.label}: ${item.value}%</p>`).join("")}</div></div>`; } function horizontalBars(data) { const max = Math.max(...data.map((item) => item.value)); return `<div class="hbars">${data.map((item) => `<div><span>${item.label}</span><div><i style="width:${(item.value / max) * 100}%"></i></div><strong>${item.value}</strong></div>`).join("")}</div>`; } function prayerForm(){return `<form class="prayer-card" data-prayer-submit><label>Fictional requester<select name="name"><option>Anonymous Demo</option><option>Jordan Demo</option><option>Morgan Sample</option></select></label><label>Sample prayer<select name="category"><option>Family</option><option>Recovery</option><option>Encouragement</option></select></label><label>Demo follow-up<select name="followup"><option value="yes">Request fictional follow-up</option><option value="no">Prayer only</option></select></label><button type="submit" class="lime-button full">Submit Fictional Prayer Request</button>${state.prayerNotice?`<p role="status">${escapeHtml(state.prayerNotice)}</p>`:''}</form>`;} function appointmentList() { return `<div class="list">${clients.slice(0, 4).map((client) => `<p><strong>${client.nextAppointment}</strong><span>${client.concern} session · Confirmed</span></p>`).join("")}</div>`; }

function bindEvents() {
  bindWorkflowEvents();
  bindWorkspaceEvents();
  bindCancellationEvents();
  bindOperationsEvents();
  bindPresentationEvents();
  bindWelcomeEvents();

  document.querySelectorAll("[data-client]").forEach((el) => el.addEventListener("click", () => { state.selectedClient = clients.find((client) => client.id === el.dataset.client); render(); }));
  document.querySelectorAll("[data-counselor-filter]").forEach((el) => el.addEventListener("click", () => { state.counselorFilter = el.dataset.counselorFilter; render(); }));
  document.querySelectorAll("[data-admin-panel]").forEach((el) => el.addEventListener("click", () => { state.activeAdminPanel = el.dataset.adminPanel; render(); }));
  document.querySelectorAll("[data-quiz-key]").forEach((el) => el.addEventListener("click", () => { state.quiz[el.dataset.quizKey] = el.dataset.quizValue; render(); }));
  document.querySelectorAll("[data-close-counselor]").forEach((el) => el.addEventListener("click", () => { state.selectedCounselor = null; render(); }));
  document.querySelectorAll("[data-close-client]").forEach((el) => el.addEventListener("click", () => { state.selectedClient = null; render(); }));

  document.querySelectorAll("[data-login-open]").forEach((el) => el.addEventListener("click", () => { state.showLogin = true; state.menuOpen = false; render(); }));
  document.querySelectorAll("[data-login-close]").forEach((el) => el.addEventListener("click", () => { state.showLogin = false; render(); }));
  document.querySelectorAll("[data-role]").forEach((el) => el.addEventListener("click", () => { state.selectedRole = el.dataset.role; render(); }));
  document.querySelectorAll("[data-login-continue]").forEach((el) => el.addEventListener("click", () => {
    state.showLogin = false;

  }));

  document.querySelectorAll("[data-book]").forEach((el) => el.addEventListener("click", () => {
    state.bookingCounselor = counselors.find((counselor) => counselor.id === el.dataset.book);
    state.bookingSubmitted = false;
    state.inquirySaveError = "";
    state.selectedCounselor = null;
    render();
  }));
  document.querySelectorAll("[data-book-close]").forEach((el) => el.addEventListener("click", () => { state.bookingCounselor = null; state.bookingSubmitted = false; render(); }));
  document.querySelectorAll("[data-booking-form]").forEach((form) => form.addEventListener("submit", (event) => { event.preventDefault(); if (state.bookingSubmitted || state.inquirySaving) return; if (localInquiryBackend()) { saveCounselingInquiry(form); return; } const fields = new FormData(form); const request = { id: `demo-${state.demoRequests.length + 1}`, demo: true, name: fields.get("name"), concern: fields.get("concern"), preferredCare: fields.get("concern"), format: fields.get("format"), preferredCounselorId: state.bookingCounselor.id, counselorId: null, appointment: null, status: "New", source: "Fictional demo", urgency: "Routine" }; state.demoRequests.unshift(request); state.activeRequestId = request.id; state.bookingSubmitted = true; state.notice = "Fictional request submitted and added to the Admin CRM."; render(); }));

  document.querySelectorAll("[data-presentation-open]").forEach((el) => el.addEventListener("click", () => { state.showPresentation = true; render(); }));
  document.querySelectorAll("[data-presentation-close]").forEach((el) => el.addEventListener("click", () => { state.showPresentation = false; render(); }));

  const resourceSearch = document.querySelector("[data-resource-search]");
  if (resourceSearch) resourceSearch.addEventListener("input", (event) => {
    const cursor = event.target.selectionStart || event.target.value.length;
    state.resourceSearch = event.target.value;
    render();
    const nextSearch = document.querySelector("[data-resource-search]");
    if (nextSearch) {
      nextSearch.focus();
      nextSearch.setSelectionRange(cursor, cursor);
    }
  });

  const resourceCategory = document.querySelector("[data-resource-category]");
  if (resourceCategory) resourceCategory.addEventListener("change", (event) => { state.resourceCategory = event.target.value; render(); });
}

function careDetails(r) {

}
function careRecords() {

function demoToday() {return new Date().toLocaleDateString('en-CA', {timeZone:'America/New_York'});}
function demoTimeOptions() {return ["09:00","09:30","10:00","11:00","14:00","16:00"].map(time => `<option>${time}</option>`).join("");}
function validDemoSlot(date,time) {if (!Number.isFinite(new Date(`${date}T12:00:00Z`).getTime())) return false; return /^\d{4}-\d{2}-\d{2}$/.test(date || "") && new Date(`${date}T12:00:00Z`).toISOString().slice(0,10) === date && date >= demoToday() && ["09:00","09:30","10:00","11:00","14:00","16:00"].includes(time);}
function workspaceNotice(r,message) {careDetails(r).message=message; state.notice=`${r.name}: ${message}`; render();}
function bindWorkspaceEvents() {
 const bind = (selector,type,handler) => document.querySelectorAll(selector).forEach(el => el.addEventListener(type,event => {event.preventDefault();handler(el);}));
 const clientRecord = id => {const r=selectedCareRecord();return state.view === "client" && r.id === id ? r : null;};
 const counselorRecord = id => {const r=selectedWorkspaceRecord();return state.view === "counselor" && r?.id === id && r.counselorId === state.demoCounselorId ? r : null;};
 bind('[data-workspace-client]','click',el=>{const r=careRecords().find(r=>r.id===el.dataset.workspaceClient && r.counselorId===state.demoCounselorId);if(r){state.workspaceClientId=r.id;state.notice="";render();document.querySelector('[data-workspace-select]')?.focus();}});
 bind('[data-workspace-select]','change',el=>{state.workspaceClientId=el.value;state.notice="";render();});
 bind('[data-sample-intake]','submit',form=>{const r=clientRecord(form.dataset.sampleIntake);if(!r)return;const fields=new FormData(form);if(!["Morning","Afternoon","Evening"].includes(fields.get('preference')) || fields.get('orientation')!=="Reviewed")return workspaceNotice(r,'Choose the sample orientation response before submitting.');careDetails(r).intake={submitted:true,preference:fields.get('preference')};workspaceNotice(r,'Sample intake submitted; your counselor can see its completion.');});
 bind('[data-homework-assign]','submit',form=>{const r=counselorRecord(form.dataset.homeworkAssign);if(!r)return;const fields=new FormData(form);const title=fields.get('title'),due=fields.get('due'); const template=activityTemplate(title); const customTitle=String(fields.get("customTitle") || "").trim(); const instructions=String(fields.get("instructions") || "").trim(); if(customTitle.length>120 || instructions.length>800)return workspaceNotice(r,"Keep mock titles and instructions within the displayed limits.");if(!homeworkTemplates.includes(title) || (due && !validDemoSlot(due,'09:00')))return workspaceNotice(r,'Choose a valid activity and today or a future due date.');const homework=careDetails(r).homework;homework.push({id:`homework-${homework.length+1}`,title:customTitle || title,type:template.type,instructions:instructions || template.instructions,due,status:'Assigned'});workspaceNotice(r,'Demo homework assigned and visible in this client’s portal.');});
 bind('[data-homework-submit]','click',el=>{const r=clientRecord(el.dataset.careClient);const h=r && careDetails(r).homework.find(h=>h.id===el.dataset.homeworkSubmit);if(h?.status==='Assigned'){const response=el.form ? String(new FormData(el.form).get('response') || '').trim() : ''; if(response.length>1500)return workspaceNotice(r,'Keep the fictional response within 1500 characters.'); h.response=response || 'Completed the fictional sample activity.'; h.status='Submitted';workspaceNotice(r,'Sample homework submitted for counselor review.');}});
 bind('[data-homework-review]','click',el=>{const r=counselorRecord(el.dataset.careClient);const h=r && careDetails(r).homework.find(h=>h.id===el.dataset.homeworkReview);if(h?.status==='Submitted'){h.status='Reviewed';workspaceNotice(r,'Homework marked reviewed.');}});
 bind('[data-reminder-toggle]','click',el=>{const r=counselorRecord(el.dataset.careClient);const reminder=r && careDetails(r).reminders.find(item=>item.id===el.dataset.reminderToggle);if(reminder){reminder.done=!reminder.done;workspaceNotice(r,'Follow-up reminder updated.');}});
 bind('[data-reschedule-request]','submit',form=>{const r=clientRecord(form.dataset.rescheduleRequest);if(!r || !(r.appointment || r.sampleAppointment) || (['Pending','Alternative proposed'].includes(careDetails(r).reschedule?.status) || careDetails(r).cancellation?.status==='Pending'))return;const fields=new FormData(form),date=fields.get('date'),time=fields.get('time'),reason=fields.get('reason');if(!validDemoSlot(date,time) || !['', 'Demo schedule conflict','Prefer a different demo time'].includes(reason))return workspaceNotice(r,'Choose a valid future demo date and time.');if(r.appointment?.date===date && r.appointment?.time===time)return workspaceNotice(r,'Choose a different date or time from the current appointment.');beginChange(r,'reschedule',{date,time,reason:reason || 'No reason provided'});workspaceNotice(r,'Reschedule requested. Your current appointment remains unchanged until admin approval.');});
 bind('[data-reschedule-approve]','click',el=>{const r=careRecords().find(r=>r.id===el.dataset.rescheduleApprove);if(r)finalizeChange(r,'reschedule','Approved');});
 bind('[data-reschedule-decline]','click',el=>{const r=careRecords().find(r=>r.id===el.dataset.rescheduleDecline);if(r)finalizeChange(r,'reschedule','Declined');});

function activityTemplate(title) {
 const templates = {
  "Sample reflection exercise": {type:"Reflection questions", instructions:"In a fictional scenario, name one helpful routine and describe a small next step."},
  "Practice a sample breathing routine": {type:"Exercise", instructions:"For this mock activity, read the demo routine and describe how a fictional character might practice it."},
  "Read the demo wellness worksheet": {type:"Reading", instructions:"Read the demo wellness resource and write a fictional one-sentence takeaway."},
  "Complete the sample worksheet": {type:"Worksheet", instructions:"Create a fictional example with a goal, one action, and a reflection. No real personal details."}
 };
 return templates[title] || templates["Sample reflection exercise"];
}
function cancellationSummary(r) {const request=careDetails(r).cancellation;return request ? `<p class="workspace-status">Cancellation request: ${request.status} · ${escapeHtml(request.reason)}</p><p>Assigned approver: ${approverLabel(r,request)}</p>` : ''; }

function adminCancellationPanel() {return operationalRequestPanel('cancellation');}

function bindCancellationEvents() {
 document.querySelectorAll('[data-cancellation-request]').forEach(form=>form.addEventListener('submit',event=>{
  event.preventDefault();const r=selectedCareRecord(),care=careDetails(r);
  if(state.view!=='client'||r.id!==form.dataset.cancellationRequest||!(r.appointment||r.sampleAppointment)||['Pending','Alternative proposed'].includes(care.reschedule?.status)||care.cancellation?.status==='Pending')return;
  const reason=new FormData(form).get('reason');if(!['','Demo schedule conflict'].includes(reason))return;
  beginChange(r,'cancellation',{reason:reason||'No reason provided'});workspaceNotice(r,'Cancellation requested; original appointment remains confirmed.');
 }));
 for(const outcome of ['approve','decline'])document.querySelectorAll(`[data-cancellation-${outcome}]`).forEach(el=>el.addEventListener('click',()=>{const id=el.dataset[outcome==='approve'?'cancellationApprove':'cancellationDecline'];const r=careRecords().find(r=>r.id===id);if(r)finalizeChange(r,'cancellation',outcome==='approve'?'Approved':'Declined');}));
}

// Phase 4: local demonstration operations; no external services or persistence.
function displayDemoTimestamp(value) {return new Date(value).toLocaleString('en-US', {timeZone:'America/New_York'}) + ' Eastern Time';}
function friendlyRecordLabel(r) { const n=r.demo ? state.demoRequests.slice().reverse().findIndex(item=>item.id===r.id) : clients.findIndex(item=>`sample-${item.id}`===r.id); return r.demo ? `Referral ${n+1}` : `Sample profile ${n+1}`; }
function ensureOperations(r) {
 const care=careDetails(r); care.changeHistory ||= []; care.appointmentHistory ||= []; care.notifications ||= []; care.assessments ||= []; return care;
}
function copyAppointment(r) {return r.appointment ? {...r.appointment} : r.sampleAppointment ? {date:r.sampleAppointment,time:'Fixture time unspecified'} : null;}
function appendNotification(r,text) {ensureOperations(r).notifications.unshift({text,at:new Date().toISOString()});}
function requestApprover(r) {return state.approvalMode==='configured' ? (ensureOperations(r).routing || 'admin') : state.approvalMode;}
function approverLabel(r,request) {return request.approver==='counselor' ? `Counselor ${counselors.find(c=>c.id===(request.counselorId || r.counselorId))?.name || 'Unassigned'}` : 'Administrator';}
function mayDecide(r,request) {return request?.approver==='counselor' ? state.view==='counselor' && (request.counselorId || r.counselorId)===state.demoCounselorId && r.counselorId===state.demoCounselorId : state.view==='admin';}
function minutes(time) {return Number(time.slice(0,2))*60+Number(time.slice(3));}
function schedulingError(r,date,time) {
 if(!validDemoSlot(date,time))return 'Choose a valid future demo date and time.';
 if(!r.counselorId)return 'Assign a counselor before scheduling.';
 const availability=state.availability[r.counselorId] || {start:540,end:1020,blocked:false};const start=minutes(time);
 if(start<availability.start || start+60>availability.end || (availability.blocked && start<720 && start+60>660))return 'This slot falls outside simulated counselor availability.';
 if(careRecords().some(other=>other.id!==r.id && other.counselorId===r.counselorId && other.appointment?.date===date && start<minutes(other.appointment.time)+60 && start+60>minutes(other.appointment.time)))return 'This counselor already has an appointment overlapping that slot.';
 return '';
}
function recordAppointment(r,kind) {ensureOperations(r).appointmentHistory.push({kind,appointment:copyAppointment(r),at:new Date().toISOString()});}
function beginChange(r,type,fields) {
 const care=ensureOperations(r); const request={...fields,type,requested:type==='reschedule'?{date:fields.date,time:fields.time}:null,approver:requestApprover(r),status:'Pending',original:copyAppointment(r),counselorId:r.counselorId,events:[{action:'Requested',at:new Date().toISOString()}]};
 care[type]=request;care.changeHistory.push(request);appendNotification(r,`${type==='reschedule'?'Reschedule':'Cancellation'} requested; original appointment remains confirmed.`);
}
function finalizeChange(r,type,outcome) {
 const request=ensureOperations(r)[type];if(request?.status!=='Pending' || !mayDecide(r,request))return workspaceNotice(r,'Only the assigned approver can finalize this pending request.');
 if(outcome==='Approved' && type==='reschedule'){const error=schedulingError(r,request.date,request.time);if(error)return workspaceNotice(r,error);}

 bind('[data-assessment-submit]','submit',form=>{const r=selectedCareRecord();if(state.view!=='client'||r.id!==form.dataset.careClient)return;const a=ensureOperations(r).assessments.find(a=>a.id===form.dataset.assessmentSubmit);if(a?.status!=='Assigned')return;const data=new FormData(form),answers=[0,1,2].map(i=>data.get(`q${i}`));if(!answers.every(value=>['0','1','2'].includes(value)))return; a.answers=answers.map(Number);a.score=a.answers.reduce((sum,value)=>sum+value,0);a.status='Submitted';appendNotification(r,'Fictional screening submitted for counselor review, not diagnosis.');workspaceNotice(r,'Sample screening scored; no diagnosis created.');});
 bind('[data-assessment-review]','click',el=>{const r=selectedWorkspaceRecord();if(!r||r.id!==el.dataset.careClient||!authorizedClinician(r))return;const a=ensureOperations(r).assessments.find(a=>a.id===el.dataset.assessmentReview);if(a?.status==='Submitted'){a.status='Reviewed';workspaceNotice(r,'Screening reviewed. Diagnosis remains a separate clinician-authored action.');}});
 bind('[data-diagnosis-save]','submit',form=>{const r=selectedWorkspaceRecord();if(!r||r.id!==form.dataset.diagnosisSave||!authorizedClinician(r))return;const data=new FormData(form),code=data.get('code'),status=data.get('status'),rationale=String(data.get('rationale')||'').trim(),goal=String(data.get('goal')||'').trim(),followup=String(data.get('followup')||'').trim();if(!diagnosisExamples[code]||!['Provisional','Confirmed'].includes(status)||data.get('ack')!=='manual'||!rationale||!goal||!followup||rationale.length>600||goal.length>200||followup.length>200)return workspaceNotice(r,'Complete the fictional rationale, goal, follow-up, and clinical distinction acknowledgement.');ensureOperations(r).diagnosis={code,status,rationale,goal,followup,author:state.demoCounselorId};appendNotification(r,'Your clinician updated fictional treatment goals and follow-up documentation.');workspaceNotice(r,'Clinician-authored demo documentation saved; screening did not generate it.');});
 bind('[data-plan-homework]','click',el=>{const r=selectedWorkspaceRecord();if(!r||r.id!==el.dataset.planHomework||!authorizedClinician(r)||!ensureOperations(r).diagnosis)return;const homework=careDetails(r).homework;homework.push({id:`homework-${homework.length+1}`,title:'Goal-related fictional reflection',type:'Reflection questions',instructions:careDetails(r).diagnosis.goal,due:'',status:'Assigned'});workspaceNotice(r,'Goal-related homework assigned.');});
 bind('[data-homework-feedback]','submit',form=>{const r=selectedWorkspaceRecord();if(state.view!=='counselor'||!r||r.id!==form.dataset.careClient)return;const h=careDetails(r).homework.find(h=>h.id===form.dataset.homeworkFeedback),feedback=String(new FormData(form).get('feedback')||'').trim();if(!h||h.status==='Assigned'||!feedback||feedback.length>500)return workspaceNotice(r,'Enter fictional feedback within 500 characters.');h.feedback=feedback;h.status='Reviewed';appendNotification(r,'Counselor feedback added to your fictional homework.');workspaceNotice(r,'Homework feedback saved.');});
 bind('[data-integration-config]','submit',form=>{if(state.view!=='integrations')return;const id=form.dataset.integrationConfig;if(!integrationCandidates.some(c=>c.id===id))return;const cadence=new FormData(form).get('cadence');if(!['manual','daily'].includes(cadence))return;state.integrationConfig[id]={...(state.integrationConfig[id]||{}),cadence,preview:'Mock configuration saved'};render();});
 bind('[data-integration-toggle]','click',el=>{const id=el.dataset.integrationToggle;if(!integrationCandidates.some(c=>c.id===id))return;const config=state.integrationConfig[id] ||= {cadence:'manual'};config.enabled=!config.enabled;render();});
 bind('[data-integration-preview]','click',el=>{const id=el.dataset.integrationPreview;if(!integrationCandidates.some(c=>c.id===id))return;const config=state.integrationConfig[id] ||= {cadence:'manual',enabled:false};config.preview=`Would share ${state.demoRequests.length} session-created fictional referrals and ${careRecords().filter(r=>r.appointment).length} dated mock appointments in a future connection`;render();});
}

// Only the explicitly supported local development frontend may call this backend.
function localInquiryBackend() {
 return ['http://127.0.0.1:5500', 'http://localhost:5500'].includes(window.location?.origin);
}
function inquiryPayload(fields) {
 const categories = {Anxiety:'individual', Grief:'individual', Marriage:'couples', Children:'family'};
 if (!['Jordan Demo','Taylor Example','Morgan Sample'].includes(fields.get('name')) || !categories[fields.get('concern')]) throw new Error('Choose one of the preset fictional scenarios.');
 if (!['email','phone'].includes(fields.get('preferred_contact_method')) || fields.get('fictional_data_only') !== 'on') throw new Error('Choose a contact preference and confirm fictional data only.');
 return {fictional_client_name:fields.get('name'), category:categories[fields.get('concern')], preferred_contact_method:fields.get('preferred_contact_method'), fictional_data_only:true};
}
async function inquiryApi(path, options = {}) {
 const controller = new AbortController();
 const timeout = setTimeout(() => controller.abort(), 10000);
 try {
  const response = await fetch('http://127.0.0.1:8000' + path, {...options, signal:controller.signal, credentials:'omit'});
  const data = await response.json();
  if (!response.ok) throw new Error((typeof data.detail === 'string' ? data.detail : 'The backend rejected the request.') + (data.errors ? ' ' + data.errors.map(e => e.field + ': ' + e.message).join('; ') : ''));
  return data;
 } catch (error) {
  if (error.name === 'AbortError' || error instanceof TypeError) throw new Error('Cannot reach the local backend. Start FastAPI on 127.0.0.1:8000 and check the local CORS setup. If a save timed out, check Saved fictional inquiries before retrying.');
  throw error;
 } finally {clearTimeout(timeout);}
}
async function saveCounselingInquiry(form) {
 if (state.inquirySaving || state.bookingSubmitted) return;
 const fields = new FormData(form), counselor = state.bookingCounselor;
 const button = form.querySelector('button[type="submit"]');
 state.inquirySaving = true; state.inquirySaveError = '';
 if (button) {button.disabled = true; button.textContent = 'Saving fictional request…';}
 try {
  const saved = await inquiryApi('/api/inquiries', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(inquiryPayload(fields))});
  // Keep the existing role walkthrough available; only the inquiry is persistent.
  const request = {id:`demo-${state.demoRequests.length + 1}`, inquiryId:saved.inquiry_id, demo:true, name:saved.fictional_client_name, concern:fields.get('concern'), preferredCare:fields.get('concern'), format:fields.get('format'), preferredCounselorId:counselor.id, counselorId:null, appointment:null, status:'New', source:'Fictional local inquiry', urgency:'Routine'};
  state.demoRequests.unshift(request); state.activeRequestId = request.id;
  state.managementLoaded = false; state.lastSavedInquiryId = saved.inquiry_id; state.savedInquiries = [saved, ...state.savedInquiries.filter(r => r.inquiry_id !== saved.inquiry_id)];
  state.bookingSubmitted = true;
  state.notice = 'Fictional inquiry saved to SQLite. Review it in Admin CRM → Appointment Requests → Saved fictional inquiries. Only inquiry fields persist.';
 } catch (error) {state.inquirySaveError = 'Request was not confirmed saved. ' + error.message;}
 finally {
  state.inquirySaving = false; render();
  if (!state.bookingSubmitted) {
   const retryForm = document.querySelector('[data-booking-form]');
   if (retryForm) for (const [name, value] of fields.entries()) {
    const input = retryForm.elements.namedItem(name);
    if (input) {if (input.type === 'checkbox') input.checked = value === 'on'; else input.value = value;}
   }
  }
 }
}
function savedInquiryPanel() {
 if (!localInquiryBackend()) return '';
 return `<section class="panel" data-saved-inquiries><h2>Saved fictional inquiries</h2><p>Local SQLite development demo only. These inquiry records persist after refresh. Assignment, scheduling, and other walkthrough actions below remain session simulations and do not update these records. No authentication or HIPAA compliance.</p><button class="secondary-button" data-inquiry-refresh ${state.inquiriesLoading ? 'disabled' : ''}>Refresh saved inquiries</button><p role="status">${escapeHtml(state.inquiriesError || (state.inquiriesLoading ? 'Loading saved inquiries…' : `${state.savedInquiries.length} saved fictional inquiries.`))}</p>${state.savedInquiries.map(r => `<article class="care-plan"><h3>${escapeHtml(r.fictional_client_name)}</h3><p>Inquiry ID: ${escapeHtml(r.inquiry_id)}</p><p>Category: ${escapeHtml(r.category)} · Contact preference: ${escapeHtml(r.preferred_contact_method)} · Status: ${escapeHtml(r.status)}</p><p>Created: ${escapeHtml(r.created_at)}</p></article>`).join('')}${!state.inquiriesLoading && !state.inquiriesError && !state.savedInquiries.length ? '<p>No saved fictional inquiries yet.</p>' : ''}</section>`;
}
async function loadSavedInquiries() {
 if (state.inquiriesLoading || !localInquiryBackend()) return;
 state.inquiriesLoading = true; state.inquiriesLoaded = true; state.inquiriesError = ''; render();
 try {state.savedInquiries = await inquiryApi('/api/inquiries');}
 catch (error) {state.inquiriesError = 'Could not refresh saved inquiries. Previously loaded records may be stale. ' + error.message;}
 finally {state.inquiriesLoading = false; render();}
}
function bindSavedInquiryEvents() {
 bindManagementEvents();
 document.querySelectorAll('[data-inquiry-refresh]').forEach(el => el.addEventListener('click', loadSavedInquiries));
 if (localInquiryBackend() && state.view === 'admin' && state.activeAdminPanel === 'appointments' && !state.inquiriesLoaded) loadSavedInquiries();
}
function managedClientsPanel() {
 const established = state.activeAdminPanel === 'established';
 const title = established ? 'Established Clients' : 'Prospective Clients';
 if (!localInquiryBackend()) return panel(title, '<p>This persistent development workflow is available only at http://127.0.0.1:5500 with the local backend running. Use fictional data only.</p>');
 const records = state.managedLists[established ? 'established' : 'prospective'];
 const profile = state.managedProfile;
 const profileMatches = profile && Boolean(profile.converted_at) === established;
 return panel(title, `<p>Fictional local development records only. No authentication or HIPAA compliance. ELCCC conversion and MYIO invitation tracking are independent. No live Valant, Calendly, or MYIO connection.</p><button class="secondary-button" data-management-refresh ${state.managementLoading || state.managementSaving ? 'disabled' : ''}>Refresh client lists</button><p role="status">${escapeHtml(state.managementError || state.managementNotice || (state.managementLoading ? 'Loading client lists…' : `${records.length} ${established ? 'established' : 'prospective'} fictional clients.`))}</p>${state.managementError && records.length ? '<p>Previously loaded records may be stale.</p>' : ''}${records.map(r => `<article class="care-plan" data-managed-record><h3>${escapeHtml(r.fictional_client_name)}</h3><p>Inquiry ID: ${escapeHtml(r.inquiry_id)}</p><p>Created: ${escapeHtml(r.created_at)} · MYIO tracking: ${escapeHtml(r.portal_status)}</p><button class="secondary-button" data-management-open="${escapeHtml(r.inquiry_id)}" ${state.managementSaving || state.managementLoading ? 'disabled' : ''}>Open fictional profile</button></article>`).join('')}${state.managementLoaded && !state.managementLoading && !state.managementError && !records.length ? '<p>No ' + (established ? 'established' : 'prospective') + ' fictional clients yet.</p>' : ''}${profileMatches ? `<section class="panel" data-managed-profile><h2>${escapeHtml(profile.fictional_client_name)} — fictional profile</h2><p>Original inquiry ID: ${escapeHtml(profile.inquiry_id)}</p><p>Inquiry created: ${escapeHtml(profile.created_at)}</p><p>Counseling category: ${escapeHtml(profile.category)} · Preferred contact method: ${escapeHtml(profile.preferred_contact_method)} · Original inquiry status: ${escapeHtml(profile.status)}</p><p>${profile.converted_at ? 'Converted: ' + escapeHtml(profile.converted_at) : 'Not converted to client.'}</p><p>Only the inquiry information above is available. No clinical intake, contact details, or diagnoses are stored.</p><form data-portal-status="${escapeHtml(profile.inquiry_id)}"><label>MYIO invitation tracking (simulated)<select name="portal_status">${['Not Sent','Sent','Activated'].map(status => `<option ${status === profile.portal_status ? 'selected' : ''}>${status}</option>`).join('')}</select></label><p>Tracking only. Saving “Sent” sends no invitation; “Activated” does not verify a MYIO account.</p><button class="secondary-button" type="submit" ${state.managementSaving || state.managementLoading ? 'disabled' : ''}>Save invitation tracking</button></form>${!profile.converted_at ? (state.confirmConversion === profile.inquiry_id ? `<div class="care-plan" role="group" aria-label="Confirm client conversion"><p>Convert ${escapeHtml(profile.fictional_client_name)} to an established fictional client? The original inquiry and history will remain saved. This does not create an external account or invite anyone.</p><button class="lime-button" data-management-confirm="${escapeHtml(profile.inquiry_id)}" ${state.managementSaving || state.managementLoading ? 'disabled' : ''}>Confirm Conversion</button><button class="secondary-button" data-management-cancel ${state.managementSaving || state.managementLoading ? 'disabled' : ''}>Cancel Conversion</button></div>` : `<button class="lime-button" data-management-convert="${escapeHtml(profile.inquiry_id)}" ${state.managementSaving || state.managementLoading ? 'disabled' : ''}>Convert to Client</button>`) : ''}<h3>Conversion and invitation history</h3><ol>${profile.history.map(event => `<li>${escapeHtml(event.occurred_at)} · ${escapeHtml(event.action)} — ${escapeHtml(event.detail)}</li>`).join('')}</ol><button class="secondary-button" data-management-close ${state.managementSaving || state.managementLoading ? 'disabled' : ''}>Close profile</button></section>` : ''}`);
}
async function loadManagedClients() {
 if (!localInquiryBackend() || state.managementLoading || state.managementSaving) return;
 state.managementLoading = true; state.managementError = ''; state.managementNotice = ''; render();
 try {
  const [prospective, established] = await Promise.all([inquiryApi('/api/prospective-clients'), inquiryApi('/api/clients')]);
  state.managedLists = {prospective, established}; state.managementLoaded = true;
  if (state.managedProfile) state.managedProfile = [...prospective, ...established].find(r => r.inquiry_id === state.managedProfile.inquiry_id) || null;
 } catch (error) {state.managementError = 'Could not load client lists. ' + error.message; state.managementLoaded = true;}
 finally {state.managementLoading = false; render();}
}
async function openManagedProfile(id) {
 if (state.managementSaving || state.managementLoading) return;
 state.managementSaving = true; state.managementError = ''; state.managementNotice = 'Loading fictional profile…'; state.managedProfile = null; state.confirmConversion = null; render();
 try {state.managedProfile = await inquiryApi('/api/inquiries/' + encodeURIComponent(id) + '/management'); state.managementNotice = '';}
 catch (error) {state.managementError = 'Could not open profile. ' + error.message; state.managementNotice = '';}
 finally {state.managementSaving = false; render();}
}
async function updateManagedProfile(id, action, payload) {
 if (state.managementSaving || state.managementLoading || state.demoRole !== 'Admin' || !localInquiryBackend()) return;
 state.managementSaving = true; state.managementError = ''; state.managementNotice = 'Saving local record…'; render();
 try {
  const record = await inquiryApi('/api/inquiries/' + encodeURIComponent(id) + '/' + action, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
  state.managedProfile = record; state.confirmConversion = null;
  for (const key of ['prospective','established']) state.managedLists[key] = state.managedLists[key].filter(r => r.inquiry_id !== id);
  state.managedLists[record.converted_at ? 'established' : 'prospective'].unshift(record);
  if (action === 'convert') state.activeAdminPanel = 'established';
  state.managementNotice = action === 'convert' ? 'Conversion saved. This record is now an established fictional client.' : 'Invitation tracking saved locally. No invitation was sent and no MYIO account was verified.';
 } catch (error) {state.managementError = 'Change was not confirmed saved. Refresh the lists before retrying. ' + error.message; state.managementNotice = '';}
 finally {state.managementSaving = false; render();}
}
function bindManagementEvents() {
 if (!localInquiryBackend() || state.view !== 'admin' || state.demoRole !== 'Admin') return;
 document.querySelectorAll('[data-management-refresh]').forEach(el => el.addEventListener('click', () => {state.managementNotice = ''; loadManagedClients();}));
 document.querySelectorAll('[data-management-open]').forEach(el => el.addEventListener('click', () => openManagedProfile(el.dataset.managementOpen)));
 document.querySelectorAll('[data-management-close]').forEach(el => el.addEventListener('click', () => {state.managedProfile = null; state.confirmConversion = null; render();}));
 document.querySelectorAll('[data-management-convert]').forEach(el => el.addEventListener('click', () => {state.confirmConversion = el.dataset.managementConvert; render();}));
 document.querySelectorAll('[data-management-cancel]').forEach(el => el.addEventListener('click', () => {state.confirmConversion = null; render();}));
 document.querySelectorAll('[data-management-confirm]').forEach(el => el.addEventListener('click', () => {if (state.confirmConversion === el.dataset.managementConfirm) updateManagedProfile(el.dataset.managementConfirm, 'convert', {confirmed:true});}));
 document.querySelectorAll('[data-portal-status]').forEach(form => form.addEventListener('submit', event => {event.preventDefault(); updateManagedProfile(form.dataset.portalStatus, 'portal-status', {portal_status:new FormData(form).get('portal_status')});}));
 if (['prospective','established'].includes(state.activeAdminPanel) && !state.managementLoaded && !state.managementLoading) loadManagedClients();
}
Object.assign(state, {managedLists:{prospective:[], established:[]}, managedProfile:null, managementLoaded:false, managementLoading:false, managementSaving:false, managementError:'', managementNotice:'', confirmConversion:null});

Object.assign(state, {savedInquiries:[], inquiriesLoaded:false, inquiriesLoading:false, inquiriesError:'', inquirySaving:false, inquirySaveError:'', lastSavedInquiryId:''});

let dialogReturnFocus = null;
function setupDialogAccessibility(focusAttribute, focusValue, hadDialog) {
 const modal = document.querySelector('.modal-backdrop');
 document.querySelectorAll('.site-header, main, .site-footer').forEach(el => { el.inert = Boolean(modal); });
 if (document.body) document.body.style.overflow = modal ? 'hidden' : '';
 if (modal) {
  if (!hadDialog) dialogReturnFocus = {attribute: focusAttribute, value: focusValue};
  const title = modal.querySelector('h2');
  if (title) { title.id = 'dialog-title'; modal.setAttribute('aria-labelledby', title.id); }
  const controls = [...modal.querySelectorAll('button, input, select, textarea, a[href]')];
  const retained = controls.find(el => focusAttribute && el.getAttribute(focusAttribute) === focusValue);
  (retained || controls[0])?.focus();
 } else {
  const target = hadDialog ? dialogReturnFocus : {attribute: focusAttribute, value: focusValue};
  const retained = target?.attribute ? [...document.querySelectorAll('[' + target.attribute + ']')].find(el => el.getAttribute(target.attribute) === target.value) : null;
  if (!hadDialog && ['data-view', 'data-workflow-go', 'data-login-continue', 'data-welcome-role', 'data-visitor'].includes(focusAttribute)) document.querySelector('main')?.focus();
  else retained?.focus();
 }
}
if (document.addEventListener) document.addEventListener('keydown', event => {
 const modal = document.querySelector('.modal-backdrop');
 if (!modal) {
  if (event.key === 'Escape' && state.menuOpen) { state.menuOpen = false; render(); document.querySelector('[data-menu-toggle]')?.focus(); }
  return;
 }
 if (event.key === 'Escape') {
  event.preventDefault(); state.selectedCounselor = null; state.selectedClient = null; state.bookingCounselor = null; state.showLogin = false; state.showPresentation = false; render(); return;
 }
 if (event.key === 'Tab') {
  const controls = [...modal.querySelectorAll('button, input, select, textarea, a[href]')].filter(el => !el.disabled && el.getClientRects().length);
  const first = controls[0], last = controls[controls.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
 }
});

render();
