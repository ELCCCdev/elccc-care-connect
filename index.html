<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ELCCC Care Connect stakeholder demonstration prototype using mock data only." />
  <title>ELCCC Care Connect — Stakeholder Prototype</title>
  <style>
    :root{--navy:#142d3a;--slate:#294d60;--blue:#668796;--mist:#e9f2f5;--cloud:#f8fbfc;--lime:#a8da44;--lime-dark:#5c7b18;--white:#fff;--ink:#102733;--muted:#58717d;--danger:#a2414d;--warn:#95691b;--shadow:0 16px 45px rgba(20,45,58,.11);--radius:24px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;background:linear-gradient(180deg,#edf6f9,#fbfdfe 34%,#edf3f5);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}h1,h2,h3,h4,p{margin-top:0}h1{font-size:clamp(2.7rem,7vw,5.9rem);letter-spacing:-.065em;line-height:.94}h2{font-size:clamp(2rem,4vw,3.8rem);letter-spacing:-.05em;line-height:1.02}h3{letter-spacing:-.025em}p{color:#465f6b;line-height:1.65}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(168,218,68,.55);outline-offset:2px}
    .prototype{background:var(--navy);color:#fff;font-size:13px;font-weight:800;padding:9px 16px;text-align:center}.prototype strong{color:var(--lime)}
    .topbar{align-items:center;background:rgba(248,251,252,.94);border:1px solid #fff;border-radius:22px;box-shadow:var(--shadow);display:flex;gap:18px;justify-content:space-between;margin:14px auto 0;max-width:1240px;padding:12px 16px;position:sticky;top:10px;width:calc(100% - 28px);z-index:20;backdrop-filter:blur(18px)}
    .brand{align-items:center;background:none;border:0;color:var(--navy);display:flex;gap:10px;font-weight:900;text-align:left}.brand-icon{background:linear-gradient(135deg,var(--lime),#efffc5);border-radius:14px;display:grid;font-size:21px;height:44px;place-items:center;width:44px}.brand small{color:var(--muted);display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase}.menu-toggle{display:none;background:var(--navy);border:0;border-radius:12px;color:#fff;font-weight:800;padding:11px 14px}.nav{align-items:center;display:flex;gap:6px}.nav button,.tabbar button{background:transparent;border:0;border-radius:999px;color:var(--slate);font-size:13px;font-weight:800;padding:10px 12px}.nav button:hover,.nav button.active,.tabbar button.active{background:var(--slate);color:#fff}.role-chip{background:#eef7da!important;color:#4d6912!important}.role-chip.admin,.role-chip.counselor{background:#e5eff3!important;color:var(--slate)!important}
    .hero{background:linear-gradient(135deg,rgba(13,39,52,.88),rgba(41,77,96,.8)),radial-gradient(circle at 15% 12%,rgba(255,255,255,.85),transparent 24%),radial-gradient(circle at 82% 20%,rgba(255,255,255,.45),transparent 25%),linear-gradient(135deg,#8aa7b3,#294d60);border-radius:0 0 48px 48px;color:#fff;display:grid;gap:42px;grid-template-columns:1.15fr .85fr;margin-top:-68px;min-height:690px;padding:150px max(24px,calc((100vw - 1160px)/2)) 70px}.hero h1,.hero h2,.hero h3,.hero p{color:#fff;text-shadow:0 2px 20px rgba(0,0,0,.35)}.hero p{font-size:19px;max-width:720px}.eyebrow{color:var(--lime);font-size:11px;font-weight:900;letter-spacing:.17em;text-transform:uppercase}.hero-card{align-self:center;background:rgba(12,38,51,.58);border:1px solid rgba(255,255,255,.25);border-radius:30px;box-shadow:0 28px 70px rgba(0,0,0,.22);padding:28px;backdrop-filter:blur(18px)}.hero-card strong{display:block;font-size:42px;letter-spacing:-.05em}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip,.status{background:#eef4f6;border-radius:999px;color:var(--slate);display:inline-block;font-size:11px;font-weight:900;padding:7px 10px}.hero .chip{background:rgba(255,255,255,.16);color:#fff}
    .btn{background:linear-gradient(135deg,var(--lime),#d9fb79);border:0;border-radius:999px;color:#17320d;font-weight:900;padding:13px 19px;transition:.2s}.btn:hover{box-shadow:0 12px 26px rgba(126,167,36,.25);transform:translateY(-2px)}.btn.secondary{background:var(--slate);color:#fff}.btn.ghost{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.35);color:#fff}.btn.danger{background:#f7e6e8;color:var(--danger)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
    .wrap{margin:auto;max-width:1240px;padding:58px 22px}.page-head{background:linear-gradient(135deg,var(--navy),var(--blue));border-radius:32px;color:#fff;margin-bottom:24px;padding:38px}.page-head h1,.page-head p{color:#fff}.page-head h1{font-size:clamp(2.5rem,5vw,4.7rem);margin-bottom:12px}.page-head p{max-width:800px}.grid{display:grid;gap:18px}.grid.metrics{grid-template-columns:repeat(4,1fr)}.grid.metrics.seven{grid-template-columns:repeat(7,1fr)}.grid.two{grid-template-columns:repeat(2,1fr)}.grid.three{grid-template-columns:repeat(3,1fr)}.grid.four{grid-template-columns:repeat(4,1fr)}
    .card{background:#fff;border:1px solid rgba(111,135,149,.13);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px}.card h3,.card h4{color:var(--navy)}.card:hover.hover{box-shadow:0 22px 55px rgba(20,45,58,.15);transform:translateY(-2px)}.metric label{color:var(--muted);display:block;font-size:10px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.metric strong{color:var(--slate);display:block;font-size:35px;letter-spacing:-.055em;margin:10px 0 6px}.metric small{color:var(--muted)}
    .section-title{margin-bottom:24px;max-width:790px}.section-title h2{margin-bottom:10px}.avatar{align-items:center;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.7),transparent 32%),linear-gradient(135deg,var(--slate),#83a4b1);border:5px solid #fff;border-radius:50%;box-shadow:0 15px 34px rgba(41,77,96,.2);color:#fff;display:grid;font-size:32px;font-weight:900;height:118px;place-items:center;position:relative;text-shadow:0 2px 10px rgba(0,0,0,.25);width:118px}.avatar:after{background:var(--lime);border-radius:50%;bottom:0;color:#17320d;content:"✦";display:grid;font-size:12px;height:32px;place-items:center;position:absolute;right:0;width:32px}.avatar.small{font-size:17px;height:58px;width:58px}.avatar.small:after{height:19px;width:19px}.counselor-card .avatar{margin:0 auto 18px}.counselor-card{text-align:center}.counselor-card p{text-align:left}.counselor-card .chips{justify-content:center}
    .tracker{display:grid;gap:4px;grid-template-columns:repeat(6,1fr);margin:22px 0}.journey-step{background:#e8f0f3;color:var(--slate);font-size:11px;font-weight:900;padding:12px;text-align:center}.journey-step:first-child{border-radius:999px 0 0 999px}.journey-step:last-child{border-radius:0 999px 999px 0}.journey-step.done{background:var(--lime);color:#22340a}
    .list{display:grid;gap:10px}.row{align-items:center;background:#f6fafb;border-radius:16px;display:flex;gap:12px;justify-content:space-between;padding:13px}.row-main{align-items:center;display:flex;gap:12px;min-width:0}.row p{margin:2px 0 0}.row-actions{display:flex;gap:7px}.alert{background:#fff7e7;border-left:4px solid #e3ad3d;border-radius:14px;color:#684917;padding:13px}.notice{background:#edf7da;border-left:4px solid var(--lime-dark);border-radius:14px;color:#354b0a;padding:14px}.warning{background:#fff2f3;border-left:4px solid var(--danger);border-radius:14px;color:#7a2f38;padding:14px}.privacy-label{background:#edf3f5;border-radius:14px;color:var(--slate);font-size:12px;font-weight:800;padding:12px}
    .quick-actions{display:grid;gap:10px;grid-template-columns:repeat(4,1fr)}.quick-actions button{background:#f3f8f9;border:1px solid #dce9ed;border-radius:16px;color:var(--slate);font-weight:800;padding:16px}.quick-actions button:hover{background:var(--slate);color:#fff}
    .calendar{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}.day{background:#f4f8fa;border:1px solid #e0ebef;border-radius:18px;padding:14px}.day strong,.day span{display:block}.slot{background:#fff;border:1px solid #d9e6eb;border-radius:10px;color:var(--slate);font-size:12px;font-weight:800;margin-top:8px;padding:9px;width:100%}.slot.selected{background:var(--lime);border-color:var(--lime-dark);color:#263908}
    .form-grid{display:grid;gap:12px;grid-template-columns:repeat(2,1fr)}input,select,textarea{background:#fff;border:1px solid #cddde3;border-radius:14px;color:var(--ink);padding:13px;width:100%}textarea{min-height:110px;resize:vertical}.full{grid-column:1/-1}.confirmation{background:#edf7da;border-radius:15px;color:#38510c;font-weight:800;padding:15px}
    .messages{display:grid;gap:16px;grid-template-columns:280px 1fr}.thread{background:#f5f9fa;border:1px solid #e0ebee;border-radius:16px;margin-bottom:8px;padding:13px}.thread.active{background:var(--slate);color:#fff}.thread.active p{color:#fff}.bubble{background:#e8f1f4;border-radius:18px 18px 18px 4px;margin-bottom:10px;max-width:75%;padding:13px}.bubble.me{background:#edf7da;border-radius:18px 18px 4px 18px;margin-left:auto}.message-foot{color:var(--muted);font-size:11px}.guardrail{background:#fff5d9;border-radius:14px;color:#71531a;font-size:12px;font-weight:800;padding:12px}
    .kanban{display:grid;gap:12px;grid-template-columns:repeat(9,minmax(180px,1fr));overflow:auto;padding-bottom:10px}.column{background:#eff5f7;border-radius:18px;padding:12px}.column h4{align-items:center;display:flex;justify-content:space-between}.column h4 span{background:var(--lime);border-radius:999px;font-size:10px;padding:5px 8px}.lead{background:#fff;border-radius:13px;box-shadow:0 7px 18px rgba(20,45,58,.07);margin-top:9px;padding:11px}.lead p{font-size:12px;margin-bottom:4px}
    .filters{display:grid;gap:10px;grid-template-columns:repeat(5,1fr);margin-bottom:18px}.integration .icon{align-items:center;background:#edf4f6;border-radius:16px;color:var(--slate);display:grid;font-size:24px;height:48px;place-items:center;width:48px}.future{background:#fff5d9;color:#765616}.security-grid{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}.security-item{background:#f4f8fa;border-radius:17px;padding:16px}.security-item strong{color:var(--slate);display:block;margin-bottom:5px}
    .tabbar{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}.roadmap{display:grid;gap:12px;grid-template-columns:repeat(6,1fr)}.phase{background:#fff;border-top:5px solid var(--lime);border-radius:18px;box-shadow:var(--shadow);padding:17px}.phase span{color:var(--lime-dark);font-size:10px;font-weight:900;text-transform:uppercase}
    .modal-backdrop{align-items:center;background:rgba(7,23,31,.7);display:flex;inset:0;justify-content:center;padding:20px;position:fixed;z-index:50}.modal{background:var(--cloud);border-radius:28px;box-shadow:0 30px 90px rgba(0,0,0,.3);max-height:92vh;max-width:900px;overflow:auto;padding:28px;position:relative;width:100%}.modal.narrow{max-width:680px}.close{background:#eaf1f3;border:0;border-radius:50%;color:var(--navy);font-size:23px;height:42px;position:absolute;right:18px;top:18px;width:42px}.role-grid{display:grid;gap:12px;grid-template-columns:repeat(3,1fr);margin:22px 0}.role-card{background:#fff;border:2px solid transparent;border-radius:18px;padding:18px;text-align:center}.role-card.active{border-color:var(--lime-dark);box-shadow:var(--shadow)}
    .footer{background:var(--navy);color:#fff;margin-top:55px;padding:32px;text-align:center}.footer p{color:rgba(255,255,255,.82);margin:3px}.footer strong{color:var(--lime)}
    @media(max-width:1050px){.grid.metrics.seven{grid-template-columns:repeat(4,1fr)}.roadmap{grid-template-columns:repeat(3,1fr)}.security-grid{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.nav{display:none;flex-direction:column;order:3;width:100%}.nav.open{display:flex}.nav button{font-size:15px;min-height:44px;width:100%}.menu-toggle{display:block}.topbar{flex-wrap:wrap}.grid.four{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:720px){h1{font-size:3rem}.wrap{padding:38px 14px}.hero{border-radius:0 0 30px 30px;margin-top:0;padding:55px 18px}.grid.metrics,.grid.metrics.seven,.grid.two,.grid.three,.grid.four,.quick-actions,.security-grid,.roadmap{grid-template-columns:1fr}.tracker{display:flex;overflow:auto}.journey-step{min-width:140px}.journey-step:first-child,.journey-step:last-child{border-radius:0}.messages{grid-template-columns:1fr}.filters,.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.calendar{display:flex;overflow:auto}.day{min-width:190px}.row{align-items:flex-start;flex-direction:column}.row-actions,.actions{width:100%}.row-actions .btn,.actions .btn{flex:1}.role-grid{grid-template-columns:1fr}.modal{padding:22px 16px}.tabbar{display:grid}.tabbar button{min-height:44px}.page-head{padding:28px 20px}.hero-card strong{font-size:32px}}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const C=[
      ["c1","Dr. Denice Colson","PhD, LPC, MAC, CPCS","Clinical Director",["Trauma","Addiction","Clinical Supervision"],["Self-pay","Aetna","BCBS"],"Faith-forward care with client consent, integrating prayer and evidence-based recovery when desired.","Limited openings · Tuesday mornings","McDonough",96],
      ["c2","Staci Stephens","LPC, RPT","Play Therapist",["Play Therapy","Children","Family Systems"],["Aetna","BCBS","Cigna","United Healthcare"],"Client-led, age-appropriate spiritual encouragement for children and parents.","Open · Monday and Wednesday afternoons","McDonough",88],
      ["c3","Melissa Smith","MA, BCCC","Counselor",["Grief","Anxiety","Depression","Relationships"],["Self-pay","Sliding scale"],"Faith-integrated support for clients who want pastoral encouragement woven into care.","Open · Tuesday and Thursday evenings","Telehealth",79],
      ["c4","Jonathan Reeves","LPC, NCC","Counselor",["Couples","Anxiety","Teens","Anger"],["Aetna","Cigna","Self-pay"],"Collaborative faith integration focused on identity, purpose, and practical growth.","Open · Fridays and evenings","Forsyth",72],
      ["c5","Rachel Kim","LCSW","Counselor",["Anxiety","Depression","Parenting","Family Systems"],["BCBS","United Healthcare","Self-pay"],"Optional faith integration; clients set the pace and level of spiritual conversation.","Open · Monday and Tuesday mornings","McDonough",68],
      ["c6","Amy Parker","APRN, PMHNP-BC","Psychiatric Nurse Practitioner",["Medication Management","Depression","Anxiety"],["Aetna","BCBS","Cigna"],"Respectful whole-person care with optional spiritual support when requested.","New evaluations · Wednesdays","McDonough",83],
      ["c7","Brian Holloway","LAPC","Counselor",["Teens","Young Adults","Stress"],["Self-pay","Sliding scale"],"Mentoring-oriented faith integration guided by client and guardian preference.","Open · After-school hours","Forsyth",61],
      ["c8","Sarah Williams","LMFT","Marriage & Family Therapist",["Marriage","Family Systems","Premarital"],["BCBS","Cigna","Self-pay"],"Biblically informed relationship care for couples and families who request it.","Waitlist · Monthly intensives","McDonough",94],
      ["c9","Maria Gonzalez","LPC","Trauma Counselor",["Trauma","Grief","Panic"],["Aetna","United Healthcare","Self-pay"],"Gentle, consent-based spiritual care emphasizing safety, dignity, and hope.","Open · Thursday and Friday afternoons","Telehealth",77],
      ["c10","Kevin Brooks","CADC-II, LAPC","Recovery Counselor",["Substance Abuse","Recovery","Family Support"],["Self-pay","Sliding scale"],"Recovery-oriented Christian care when requested, paired with practical relapse prevention.","Open · Evening groups","McDonough",74],
      ["c11","Lauren Bennett","LPC","Child & Adolescent Counselor",["Children","Teens","ADHD","Parent Coaching"],["Aetna","BCBS","Peachstate"],"Optional child-friendly faith integration with guardian consent and client comfort.","Open · Monday–Thursday afternoons","Forsyth",81],
      ["c12","Thomas Green","PhD, LPC","Senior Counselor",["Burnout","Leadership","Spiritual Direction"],["Self-pay","BCBS"],"Integrative care for clients seeking clinical wisdom and spiritual discernment.","Limited executive blocks","Telehealth",86]
    ].map(x=>({id:x[0],name:x[1],credentials:x[2],role:x[3],specialties:x[4],insurance:x[5],faith:x[6],availability:x[7],location:x[8],utilization:x[9]}));
    const first=["Avery","Jordan","Taylor","Morgan","Casey","Riley","Harper","Parker","Elliot","Quinn","Reese","Cameron","Logan","Maya","Noah","Olivia","Ethan","Sophia","Caleb","Grace"],last=["Bennett","Carter","Davis","Edwards","Foster","Gray","Hayes","Johnson","King","Lewis","Mitchell","Nelson","Owens","Price","Reed","Simmons","Turner","Walker","Young","Brooks"],concerns=["Anxiety","Depression","Trauma","Grief","Marriage","Parenting","Recovery","Stress","Child Behavior","Spiritual Direction"];
    const clients=Array.from({length:50},(_,i)=>({id:`cl${i+1}`,name:`${first[i%20]} ${last[(i*3)%20]}`,age:i%7===0?"Child":i%5===0?"Teen":"Adult",counselor:C[i%12].id,status:["New Inquiry","Contacted","Intake Started","Insurance Review","Counselor Assigned","Scheduled","Active","Follow-Up","Closed"][i%9],concern:concerns[(i*2)%10],insurance:["Approved","Pending","Needs Information"][i%3],next:`Sep ${8+(i%20)}, 2026`}));
    const inquiries=Array.from({length:27},(_,i)=>({id:`in${i+1}`,name:`${first[(i+3)%20]} ${last[(i*5)%20]}`,service:["Individual","Play Therapy","Marriage","Trauma Recovery","Medication"][i%5],status:["New Inquiry","Contacted","Intake Started","Insurance Review","Counselor Assigned","Scheduled","Active","Follow-Up","Closed"][i%9],insurance:["Pending","Approved","Needs Information"][i%3],counselor:C[i%12].name,appointment:["Not scheduled","Requested","Confirmed"][i%3]}));
    const resources=Array.from({length:100},(_,i)=>({title:["Grounding Skills","Preparing for Your First Visit","Healthy Boundaries","Restoring Communication","Calming Breath Prayer","Understanding Trauma Responses","Parenting Through Change","Recovery Planning","Grief in Daily Life","Emotional Regulation Tools"][i%10]+(i>9?` · Part ${Math.floor(i/10)+1}`:""),category:["Anxiety","Getting Started","Trauma","Marriage","Faith & Wellness","Parenting","Recovery","Grief"][i%8],audience:["Adults","Parents","Teens","Couples","Families"][i%5]}));
    const state={view:"home",role:"Public",menu:false,modal:null,selectedCounselor:null,clientTab:"overview",counselorTab:"workspace",adminTab:"pipeline",resourceSearch:"",resourceCategory:"All",booking:{counselor:"c2",type:"Individual Counseling",format:"Telehealth",date:"Sep 9",time:"10:30 AM"},bookingConfirmed:false,appointmentState:"Confirmed",messageChannel:"client",loginRole:"Client"};
    const initials=n=>n.replace("Dr. ","").split(" ").map(v=>v[0]).join("").slice(0,2).toUpperCase();
    const avatar=(n,small=false)=>`<div class="avatar ${small?"small":""}" aria-label="${n} illustrated initials avatar">${initials(n)}</div>`;
    const btn=(label,attr="",kind="")=>`<button class="btn ${kind}" ${attr}>${label}</button>`;
    const metric=(label,value,detail)=>`<article class="card metric"><label>${label}</label><strong>${value}</strong><small>${detail}</small></article>`;
    const card=(title,body,cls="")=>`<section class="card ${cls}"><h3>${title}</h3>${body}</section>`;
    function render(){document.getElementById("root").innerHTML=`<div class="prototype"><strong>Prototype only</strong> — no real client or medical data. Not a HIPAA-compliant system.</div>${navigation()}<main>${page()}</main>${footer()}${modal()}</div>`;bind()}
    function navigation(){const publicNav=[["Home","home"],["Find Care","counselors"],["Match Quiz","quiz"],["Resources","resources"],["Prayer","prayer"]],clientNav=[["Dashboard","client"],["Book / Change","booking"],["Messages","messages"]],counselorNav=[["Workspace","counselor"],["Schedule","booking"],["Messages","messages"]],adminNav=[["CRM","admin"],["Integrations","integrations"],["Privacy & Security","security"],["Roadmap","roadmap"]];let items=state.role==="Client"?clientNav:state.role==="Counselor"?counselorNav:state.role==="Admin"?adminNav:publicNav;return `<header class="topbar"><button class="brand" data-view="home"><span class="brand-icon">☁</span><span>ELCCC<strong> Care Connect</strong><small>One coordinated care experience</small></span></button><button class="menu-toggle" data-menu>☰ Menu</button><nav class="nav ${state.menu?"open":""}">${items.map(([l,v])=>`<button data-view="${v}" class="${state.view===v?"active":""}">${l}</button>`).join("")}<button class="role-chip ${state.role.toLowerCase()}" data-login>${state.role==="Public"?"Demo Login":state.role+" Demo ▾"}</button></nav></header>`}
    function page(){return ({home, counselors,quiz,resources:resourcesPage,prayer,client,booking,messages:()=>messaging(),counselor,admin,integrations,security,roadmap})[state.view]?.()||home()}
    function home(){return `<section class="hero"><div><p class="eyebrow">Eagle's Landing Christian Counseling Center</p><h1>One connected path from inquiry to ongoing care.</h1><p>A stakeholder prototype showing how clients, counselors, and staff could coordinate scheduling, intake, communication, documentation, payments, and follow-up in one calm experience.</p><div class="actions">${btn("Find a Counselor",'data-view="counselors"')}${btn("Open Role Demo","data-login","ghost")}${btn("Presentation Overview",'data-presentation',"ghost")}</div></div><aside class="hero-card"><span class="eyebrow">Workflow snapshot</span><strong>27 inquiries</strong><p>Mock care coordination across intake, insurance review, counselor matching, scheduling, and active care.</p><div class="chips"><span class="chip">Scheduling</span><span class="chip">Documentation</span><span class="chip">Messaging</span><span class="chip">Billing</span></div></aside></section><section class="wrap"><div class="section-title"><p class="eyebrow" style="color:var(--lime-dark)">Stakeholder priorities</p><h2>Reduce duplicate work without compromising client boundaries.</h2><p>The proposed product gives every role a focused experience and preserves strict separation between unrelated client records.</p></div><div class="grid three">${card("One-stop client experience","<p>Self-service booking, intake, insurance status, messages, homework, documents, reminders, resources, and mock payments.</p>","hover")}${card("Counselor workflow support","<p>Schedule, alerts, documentation queue, draft-note assistance, forms review, missed visits, and coordination tasks.</p>","hover")}${card("Operational visibility","<p>Care journey pipeline, filters, assignment, no-show tracking, integration concepts, and future security requirements.</p>","hover")}</div></section>${teamSection()}${prayerSection()}`}
    function teamSection(){return `<section class="wrap"><div class="section-title"><p class="eyebrow" style="color:var(--lime-dark)">Meet Our Care Team</p><h2>Specialized care, represented with neutral demo avatars.</h2></div><div class="grid four">${C.slice(0,8).map(c=>`<article class="card counselor-card hover">${avatar(c.name)}<h3>${c.name}</h3><p class="status">${c.credentials}</p><div class="chips">${c.specialties.slice(0,3).map(s=>`<span class="chip">${s}</span>`).join("")}</div><div class="actions">${btn("View Profile",`data-counselor="${c.id}"`,"secondary")}</div></article>`).join("")}</div></section>`}

,"danger")}</div>`)}${card("Notifications",listRows([["!","Insurance card requested","Today"],["✉","New message from Melissa","Yesterday"],["✓","Homework submitted","Sep 1"]]))}${card("Recommended resources",resources.slice(0,4).map(r=>`<div class="row"><strong>${r.title}</strong><span class="status">${r.category}</span></div>`).join(""))}${card("Secure messages",`<p>Message your assigned counselor or authorized intake staff only.</p>${btn("Open Messages",'data-client-tab="messages"',"secondary")}`)}</div>`}
    function billing(){return `<div class="grid two">${card("Current balance",`<div class="metric"><strong>$85.00</strong><small>Mock balance · Client responsibility</small></div>${btn("Make Payment — Demo Only",'data-confirm="Demo payment flow opened. No payment was processed."')}<div class="notice" style="margin-top:14px">Production payment processing is a future secure integration. No payment data is collected here.</div>`)}${card("Payment history",listRows([["$35","Aug 25 session","Client responsibility · Paid"],["$115","Aug 25 session","Insurance paid"],["$35","Aug 11 session","Client responsibility · Paid"],["$115","Aug 11 session","Insurance paid"]]))}</div>`}

    function profile(c){return `<div class="modal-backdrop"><article class="modal"><button class="close" data-close>×</button><div class="row-main">${avatar(c.name)}<div><span class="status">${c.credentials}</span><h2 style="margin:10px 0">${c.name}</h2><p>${c.role} · ${c.location}</p></div></div><div class="grid two" style="margin-top:20px">${card("Specialties",`<div class="chips">${c.specialties.map(x=>`<span class="chip">${x}</span>`).join("")}</div>`)}${card("Insurance accepted",`<p>${c.insurance.join(" · ")}</p>`)}${card("Faith integration approach",`<p>${c.faith}</p>`)}${card("Availability",`<p>${c.availability}</p>`)}</div><div class="actions">${btn("Request Appointment",`data-book="${c.id}"`)}${btn("Close",'data-close',"secondary")}</div></article></div>`}
    function login(){return `<div class="modal-backdrop"><article class="modal narrow"><button class="close" data-close>×</button><p class="eyebrow" style="color:var(--lime-dark)">Role-Based Demo Login</p><h2>Choose your demonstration role.</h2><p>No password or real authentication is used. Selecting a role changes navigation and limits the demonstration to role-appropriate views.</p><div class="role-grid">${["Client","Counselor","Admin"].map(r=>`<button class="role-card ${state.loginRole===r?"active":""}" data-login-role="${r}"><strong>${r} Demo</strong><p>${r==="Client"?"Only your own mock care information":r==="Counselor"?"Assigned clients and workflow tools":"CRM, integrations, and architecture"}</p></button>`).join("")}</div>${btn(`Continue as ${state.loginRole}`,"data-login-continue","full")}</article></div>`}
    function presentation(){return `<div class="modal-backdrop"><article class="modal"><button class="close" data-close>×</button><p class="eyebrow" style="color:var(--lime-dark)">Stakeholder Presentation Overview</p><h2>From fragmented tasks to coordinated care workflows.</h2><div class="grid two">${card("Problems counselors identified","Scheduling changes, no-shows, repetitive administration, notes, reminders, billing coordination, intake, insurance, messaging, forms, calendar management, and outside coordination.")}${card("Proposed workflows","Role-specific workspaces, client self-service, care journey tracking, queues, alerts, authorized messaging, forms exchange, and integration concepts.")}${card("Client experience","A private one-stop portal for booking, intake, insurance, forms, homework, notifications, messages, resources, and mock billing.")}${card("Counselor experience","Daily schedule, alerts, assignments, documentation drafts, forms review, missed-visit follow-up, and coordination tasks.")}${card("Admin CRM","Nine-stage care pipeline, assignment and appointment queues, prayer operations, filters, no-shows, insurance review, and utilization.")}${card("Integration architecture","Future Valant, calendar, telehealth, verification, payment, and reminder connections — no live integrations in this demo.")}${card("Privacy / security approach","Future role-based access, MFA, encryption, audit logs, consent, secure storage, isolation, retention, BAAs, resilience, and risk assessments.")}${card("Next discovery questions","Which system owns each field? Which workflows create duplicate work? What can Valant expose? What consents and roles are required? What outcomes define success?")}</div><div class="warning" style="margin-top:16px">Prototype only — no real client or medical data. This is not a HIPAA-compliant application.</div></article></div>`}
    function confirmation(text){return `<div class="modal-backdrop"><article class="modal narrow"><button class="close" data-close>×</button><div class="confirmation">✓ ${text}</div><p style="margin-top:16px">This action changed mock interface state only. No data was stored, sent, scheduled, recorded, or processed.</p>${btn("Continue",'data-close')}</article></div>`}
    function modal(){if(state.modal==="login")return login();if(state.modal==="presentation")return presentation();if(state.modal&&state.modal.startsWith("confirm:"))return confirmation(state.modal.slice(8));if(state.selectedCounselor)return profile(C.find(c=>c.id===state.selectedCounselor));return ""}
    function head(k,t,d){return `<header class="page-head"><p class="eyebrow">${k}</p><h1>${t}</h1><p>${d}</p></header>`}
    function listRows(items){return `<div class="list">${items.map(([a,b,c])=>`<div class="row"><div class="row-main"><span class="status">${a}</span><div><strong>${b}</strong><p>${c}</p></div></div></div>`).join("")}</div>`}
    function footer(){return `<footer class="footer"><p><strong>ELCCC Care Connect Prototype</strong> • Built for stakeholder demonstration • No real client or medical data.</p><p>Future HIPAA-ready architecture concepts shown; not implemented. Prototype by Danyel Fluker.</p></footer>`}
    function bind(){document.querySelectorAll("[data-menu]").forEach(e=>e.onclick=()=>{state.menu=!state.menu;render()});document.querySelectorAll("[data-view]").forEach(e=>e.onclick=()=>{state.view=e.dataset.view;state.menu=false;render();scrollTo(0,0)});document.querySelectorAll("[data-login]").forEach(e=>e.onclick=()=>{state.modal="login";render()});document.querySelectorAll("[data-login-role]").forEach(e=>e.onclick=()=>{state.loginRole=e.dataset.loginRole;render()});document.querySelectorAll("[data-login-continue]").forEach(e=>e.onclick=()=>{state.role=state.loginRole;state.view=state.role==="Client"?"client":state.role==="Counselor"?"counselor":"admin";state.modal=null;render()});document.querySelectorAll("[data-counselor]").forEach(e=>e.onclick=()=>{state.selectedCounselor=e.dataset.counselor;render()});document.querySelectorAll("[data-book]").forEach(e=>e.onclick=()=>{state.booking.counselor=e.dataset.book;state.selectedCounselor=null;state.view="booking";render()});document.querySelectorAll("[data-close]").forEach(e=>e.onclick=()=>{state.modal=null;state.selectedCounselor=null;render()});document.querySelectorAll("[data-presentation]").forEach(e=>e.onclick=()=>{state.modal="presentation";render()});document.querySelectorAll("[data-confirm]").forEach(e=>e.onclick=()=>{state.modal="confirm:"+e.dataset.confirm;render()});document.querySelectorAll("[data-client-tab]").forEach(e=>e.onclick=()=>{state.clientTab=e.dataset.clientTab;render()});document.querySelectorAll("[data-counselor-tab]").forEach(e=>e.onclick=()=>{state.counselorTab=e.dataset.counselorTab;render()});document.querySelectorAll("[data-admin-tab]").forEach(e=>e.onclick=()=>{state.adminTab=e.dataset.adminTab;render()});document.querySelectorAll("[data-channel]").forEach(e=>e.onclick=()=>{state.messageChannel=e.dataset.channel;render()});document.querySelectorAll("[data-slot]").forEach(e=>e.onclick=()=>{[state.booking.date,state.booking.time]=e.dataset.slot.split("|");state.bookingConfirmed=false;render()});document.querySelectorAll("[data-book-field]").forEach(e=>e.onchange=()=>{state.booking[e.dataset.bookField]=e.value;state.bookingConfirmed=false;render()});document.querySelectorAll("[data-book-confirm]").forEach(e=>e.onclick=()=>{state.bookingConfirmed=true;state.appointmentState="Confirmed";render()});document.querySelectorAll("[data-cancel]").forEach(e=>e.onclick=()=>{state.appointmentState="Cancellation Requested";state.modal="confirm:Mock cancellation request received.";render()});let rs=document.querySelector("[data-resource-search]");if(rs)rs.oninput=e=>{state.resourceSearch=e.target.value;render();let n=document.querySelector("[data-resource-search]");n?.focus()};let rc=document.querySelector("[data-resource-category]");if(rc)rc.onchange=e=>{state.resourceCategory=e.target.value;render()}}
    render();
  </script>
</body>
</html>
